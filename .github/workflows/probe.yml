# ชั่วคราว: เก็บตัวอย่างไฟล์จาก Doc สาธารณะไว้ที่ branch probe-data (ไม่ใช้ key ใด ๆ)
name: probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ID=11lXA1hl_ZiBV_kCget8vxl1RGVGM_7beGwfYX6r2EnE
          mkdir s && cd s
          curl -sL "https://docs.google.com/document/d/$ID/edit" -o edit.html
          for T in t.iraleqedgdi8 $(grep -oE '"t\.[a-z0-9]+",\[1,"(Normal values[^"]*|Physical Exam \(GA\)|Lipid Lowering Drugs)"' edit.html | grep -oE 't\.[a-z0-9]+'); do curl -sL "https://docs.google.com/document/d/$ID/export?format=html&tab=$T" -o "tab-$T.html"; done
          ls -la
          git init -q && git checkout -q -b probe-data && git add . && git -c user.name=probe -c user.email=probe@example.com commit -q -m data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
