# ชั่วคราว: หาว่าดึงทุกแท็บของ Doc สาธารณะได้ทางไหน (ไม่ใช้ key ใด ๆ)
name: probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ID=11lXA1hl_ZiBV_kCget8vxl1RGVGM_7beGwfYX6r2EnE
          curl -sL "https://docs.google.com/document/d/$ID/edit" -o edit.html
          echo "::notice title=edit::size $(wc -c < edit.html) ids $(grep -oE 't\.[a-z0-9]{8,16}' edit.html | sort -u | wc -l): $(grep -oE 't\.[a-z0-9]{8,16}' edit.html | sort -u | head -12 | tr '\n' ' ') neuro=$(grep -c 'Neuroanatomy' edit.html)"
          curl -sL "https://docs.google.com/document/d/$ID/mobilebasic" -o mb.html
          echo "::notice title=mobilebasic::size $(wc -c < mb.html) ids $(grep -oE 't\.[a-z0-9]{8,16}' mb.html | sort -u | wc -l) neuro=$(grep -c 'Neuroanatomy' mb.html) lipid=$(grep -c 'HMG-CoA' mb.html)"
          curl -sL "https://docs.google.com/document/d/$ID/pub" -o pub.html
          echo "::notice title=pub::size $(wc -c < pub.html)"
          for f in html txt; do curl -sL "https://docs.google.com/document/d/$ID/export?format=$f" -o all.$f; echo "::notice title=export $f::size $(wc -c < all.$f) lipid=$(grep -c 'HMG-CoA' all.$f)"; done
