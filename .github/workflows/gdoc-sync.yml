# ดึง Google Doc "โพยหมอ" มาอัปเดตเว็บอัตโนมัติ (Doc แชร์ Anyone with the link แล้ว จึงดึงได้โดยไม่ต้องใช้รหัส)
# - ทุก ~10 นาที (GitHub อาจช้ากว่านี้บ้าง) + กดรันเองได้ที่แท็บ Actions → "Sync Google Doc" → Run workflow
# - commit เฉพาะเมื่อเนื้อหาใน Doc เปลี่ยน · แท็บ homework ไม่ขึ้นเว็บ
name: Sync Google Doc
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gdoc-sync.yml', 'tools/gdoc/build.py', 'docs/gdoc.js']
permissions:
  contents: write
concurrency:
  group: gdoc-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ติดตั้ง Playwright (ใช้ Chrome ที่มีในเครื่อง)
        run: pip install playwright==1.48.0
      - name: ดึง Doc โพยหมอ
        run: |
          mkdir -p /tmp/gdoc && cd /tmp/gdoc
          curl -sSfL "https://docs.google.com/document/d/11lXA1hl_ZiBV_kCget8vxl1RGVGM_7beGwfYX6r2EnE/export?format=zip" -o doc.zip
          file doc.zip
          unzip -o -q doc.zip
          ls -la
      - name: แปลงเป็นหน้าเว็บ
        env:
          PW_CHANNEL: chrome
        run: python3 tools/gdoc/build.py /tmp/gdoc poymor --hide "homework (?)" --min-tabs 20
      - name: commit ถ้ามีอะไรเปลี่ยน
        run: |
          if [ -n "$(git status --porcelain docs/gdoc)" ]; then
            git config user.name "poymor-sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/gdoc
            git commit -m "อัปเดตจาก Google Doc โพยหมอ"
            git push
          else
            echo "Doc ไม่เปลี่ยน"
          fi
