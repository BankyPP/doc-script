<title>Bug → Drug Drill</title>

<style>
/* Layout: one study bench — header + group filters on top, a single large specimen card in the middle, controls under it. Gram-stain palette: crystal violet = Gram+, safranin = Gram−. */
:root{
  --bg:#f5f3f8; --surface:#ffffff; --surface-2:#eeeaf4; --ink:#1e1830; --muted:#6a6380; --line:#dcd6e6;
  --violet:#5a2d91; --violet-soft:#ece3f7; --safranin:#c0306a; --safranin-soft:#fbe4ee;
  --good:#1f7a4d; --good-soft:#dff3e8; --bad:#b4232c; --bad-soft:#fbe3e4;
  --g0:#5a2d91; --g1:#c0306a; --g2:#d0582f; --g3:#5d7a1f; --g4:#3d4f6b; --g5:#0f7d7a;
  --shadow:0 1px 2px rgba(30,24,48,.06),0 8px 24px rgba(30,24,48,.08);
  --f-display:"Bricolage Grotesque","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13101b; --surface:#1d1828; --surface-2:#262035; --ink:#efeaf7; --muted:#a59db8; --line:#352d47;
  --violet:#b48cf0; --violet-soft:#2e2343; --safranin:#f07aa6; --safranin-soft:#3a1f2c;
  --good:#5fd39a; --good-soft:#163527; --bad:#ff7d84; --bad-soft:#3d1a1e;
  --g0:#b48cf0; --g1:#f07aa6; --g2:#f0956c; --g3:#a9c95e; --g4:#9fb3d6; --g5:#4fd1c9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13101b; --surface:#1d1828; --surface-2:#262035; --ink:#efeaf7; --muted:#a59db8; --line:#352d47;
  --violet:#b48cf0; --violet-soft:#2e2343; --safranin:#f07aa6; --safranin-soft:#3a1f2c;
  --good:#5fd39a; --good-soft:#163527; --bad:#ff7d84; --bad-soft:#3d1a1e;
  --g0:#b48cf0; --g1:#f07aa6; --g2:#f0956c; --g3:#a9c95e; --g4:#9fb3d6; --g5:#4fd1c9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;}

html{background:var(--bg)}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 .arrow{color:var(--safranin)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tally{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tally b{color:var(--ink);font-weight:500}
.meter{width:120px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--safranin));width:0;transition:width .3s}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px 5px 9px;font-size:13px;user-select:none}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.opts{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:13px}

/* card stage */
.stage{display:flex;flex-direction:column;gap:14px}
.progress{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.card{position:relative;perspective:1400px;min-height:280px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.card .face{position:absolute;inset:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px;backface-visibility:hidden;
  transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card .back{transform:rotateY(180deg);background:var(--violet-soft)}
.card.flipped .front{transform:rotateY(-180deg)}
.card.flipped .back{transform:rotateY(0)}
.face .tag{position:absolute;top:14px;left:16px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);font-weight:700;display:flex;gap:6px;align-items:center}
.face .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.face .side{position:absolute;top:14px;right:16px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.face .known-badge{position:absolute;bottom:14px;left:16px;font-size:12px;color:var(--good);font-weight:600}
.bug{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,46px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance;max-width:100%;overflow-wrap:anywhere}
.drug{font-weight:700;font-size:clamp(22px,4.6vw,34px);line-height:1.25;color:var(--violet);text-wrap:balance;overflow-wrap:anywhere}
.ask{font-size:13px;color:var(--muted);margin-top:4px}
.hint{position:absolute;bottom:14px;right:16px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface-2)}
.btn.again{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.again:hover{background:var(--bad-soft)}
.btn.know{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.btn.know:hover{background:var(--good-soft)}
.btn.primary{background:var(--violet);color:var(--surface);border-color:var(--violet)}
.btn.primary kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.7}
.btn:disabled{opacity:.4;cursor:default}

/* quiz */
.qcard{border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:14px;position:relative}
.qcard .tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);font-weight:700;display:flex;gap:6px;align-items:center}
.qcard .tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-size:15px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.choice:hover:not(:disabled){border-color:var(--violet)}
.choice .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex-shrink:0;margin-top:2px}
.choice span.t{min-width:0;overflow-wrap:anywhere}
.choice.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.choice.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.feedback{font-weight:600;min-height:1.5em}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.tile{min-height:92px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:10px;font-size:14px;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;min-width:0;transition:transform .15s,opacity .3s,background .2s}
.tile.bugt{font-family:var(--f-display);font-weight:800;font-size:16px}
.tile.drugt{color:var(--violet);font-weight:600}
.tile.sel{outline:2px solid var(--safranin);outline-offset:1px;transform:translateY(-2px)}
.tile.done{opacity:0;pointer-events:none}
.tile.wrong{animation:shake .35s;background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* summary */
.summary{border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px}
.summary h2{font-family:var(--f-display);font-weight:800;font-size:28px;margin:0}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:26px;color:var(--ink);font-family:var(--f-display);font-weight:800}
.missed{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed div{display:flex;gap:10px;justify-content:space-between;font-size:14px;flex-wrap:wrap}
.missed div b{font-weight:700}
.missed div span{color:var(--violet);text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:13px}
.confirm button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:13px}
.confirm button.danger{color:var(--bad);border-color:var(--bad)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion: reduce){.card .face,.tile,.meter i{transition:none}.tile.wrong{animation:none}}
</style>

  <header>
    <div class="brand">

</div>

/* ---------- Quiz ---------- */
function startQuiz(){ const q = pool(); S.quiz = { order: q, pos: 0, score: 0, answered: null, opts: null, missed: [] }; }
function buildOpts(i){
  const c = CARDS[i], right = c.d;
  const same = shuffle(CARDS.filter((x,j)=>j!==i && x.g===c.g && x.d!==right).map(x=>x.d));
  const other = shuffle(CARDS.filter((x,j)=>j!==i && x.d!==right).map(x=>x.d));
  const picks = [];
  for (const d of [...same, ...other]) { if (!picks.includes(d)) picks.push(d); if (picks.length === 3) break; }
  return shuffle([right, ...picks]);
}
function renderQuiz(){

    const pct = Math.round(Q.score / Q.order.length * 100);
    st.innerHTML = `<div class="summary"><h2>${pct}%</h2>
      <div class="stats"><span><b>${Q.score}</b>ถูก</span><span><b>${Q.order.length - Q.score}</b>ผิด</span><span><b>${Q.order.length}</b>ข้อทั้งหมด</span></div>

    $("#qNew").onclick = () => { startQuiz(); renderQuiz(); };
    if (Q.missed.length) $("#qMiss").onclick = () => { const m = shuffle(Q.missed); S.quiz = { order: m, pos: 0, score: 0, answered: null, opts: null, missed: [] }; renderQuiz(); };
    return;
  }
  const i = Q.order[Q.pos], c = CARDS[i];
  if (!Q.opts) Q.opts = buildOpts(i);
  const a = Q.answered;
  st.innerHTML = `
    <div class="progress"><span>ข้อ ${Q.pos + 1} / ${Q.order.length}</span><span>ถูก ${Q.score}</span></div>
    <div class="qcard" style="--c:${gcol(c.g)}"><span class="tag">${esc(GROUPS[c.g].short)}</span>
      <div class="bug">${esc(c.b)}</div><div class="ask" style="margin-top:-6px">ยา first line คือข้อไหน?</div>

        let cls = ""; if (a !== null) { if (d === c.d) cls = "ok"; else if (k === a) cls = "no"; }
        return `<button class="choice ${cls}" type="button" data-k="${k}" ${a !== null ? "disabled" : ""}><span class="k">${k+1}</span><span class="t">${esc(d)}</span></button>`; }).join("")}</div>

      ${a !== null ? `<button class="btn primary" id="qNext" type="button">ข้อถัดไป <kbd>Enter</kbd></button>` : ""}
    </div>`;
  st.querySelectorAll(".choice").forEach(b => b.onclick = () => quizPick(+b.dataset.k));

function quizPick(k){
  const Q = S.quiz; if (Q.answered !== null || Q.pos >= Q.order.length) return;
  const i = Q.order[Q.pos]; Q.answered = k;
  if (Q.opts[k] === CARDS[i].d) { Q.score++; S.known.add(i); } else { Q.missed.push(i); S.known.delete(i); }

/* ---------- Match ---------- */
function startMatch(){
  const ids = pool(), picked = [], used = new Set();
  for (const i of (S.shuffle ? ids : shuffle(ids))) { if (!used.has(CARDS[i].d)) { picked.push(i); used.add(CARDS[i].d); } if (picked.length === 6) break; }

function fmt(ms){ const s = ms/1000; return s.toFixed(1) + " s"; }
function renderMatch(){
  const M = S.match, st = $("#stage");
  if (M.tiles.length < 4) { st.innerHTML = `<div class="summary empty">ต้องมีอย่างน้อย 2 คู่ — เลือกกลุ่มเชื้อเพิ่ม</div>`; return; }

  if (M.done.size === pairs) {
    const t = M.end - M.start; const isBest = !S.best || t < S.best;

    st.innerHTML = `<div class="summary"><h2>${fmt(t)}</h2>
      <div class="stats"><span><b>${pairs}</b>คู่</span><span><b>${M.errors}</b>จับคู่ผิด</span><span><b>${S.best ? fmt(S.best) : "–"}</b>สถิติดีสุด</span></div>

  }

    <div class="mgrid">${M.tiles.map((x,k)=>{
      const c = CARDS[x.i];
      return `<button type="button" class="tile ${x.t==="b"?"bugt":"drugt"} ${M.done.has(x.i)?"done":""} ${M.sel===k?"sel":""}" data-k="${k}" style="${x.t==="b"?`border-left:4px solid ${gcol(c.g)}`:""}">${esc(x.t==="b"?c.b:c.d)}</button>`; }).join("")}</div>
    <div class="row"><button class="btn" id="mShuf" type="button">สุ่มชุดใหม่</button></div>`;
  st.querySelectorAll(".tile").forEach(t => t.onclick = () => matchPick(+t.dataset.k, t));

}
function matchPick(k, el){
  const M = S.match;
  if (!M.start) { M.start = Date.now(); M.timer = setInterval(()=>{ const e=$("#mt"); if (e && S.mode==="match" && M.start && !M.end) e.textContent = fmt(Date.now()-M.start); }, 100); }
  if (M.sel === null) { M.sel = k; renderMatch(); return; }
  if (M.sel === k) { M.sel = null; renderMatch(); return; }
  const a = M.tiles[M.sel], b = M.tiles[k];
  if (a.i === b.i && a.t !== b.t) {
    M.done.add(a.i); M.sel = null;
    if (M.done.size === M.tiles.length/2) { M.end = Date.now(); clearInterval(M.timer); }
    renderMatch();
  } else {
    M.errors++; const prev = M.sel; M.sel = null; renderMatch();
    [prev, k].forEach(x => { const t = document.querySelector(`.tile[data-k="${x}"]`); if (t) { t.classList.add("wrong"); setTimeout(()=>t.classList.remove("wrong"), 380); } });
  }
}

    if (e.key === " " ) { e.preventDefault(); S.flash.flipped = !S.flash.flipped; renderFlash(); }
    else if (e.key === "ArrowRight" || e.key === "2") flashAnswer(true);
    else if (e.key === "ArrowLeft" || e.key === "1") flashAnswer(false);
  } else if (S.mode === "quiz" && S.quiz) {
    if (["1","2","3","4"].includes(e.key)) quizPick(+e.key - 1);
    else if (e.key === "Enter" && S.quiz.answered !== null) { e.preventDefault(); quizNext(); }
  }
});

renderFilters();
setMode("flash");
</script>
