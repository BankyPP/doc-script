<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังข้อสอบเก่า NL · โพยหมอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EBEFEA; --sheet:#FFFFFF; --ink:#1B2425; --muted:#5A6665; --rule:#D5DCD6;
  --form:#C2386A; --form-soft:#F6DCE6; --graphite:#2A2E31; --on-graphite:#FFFFFF;
  --right:#1D7A50; --right-soft:#DDF1E6; --wrong:#B2412A; --wrong-soft:#F8E1DA;
  --hl:#FFF0A0; --warn:#9A6400; --warn-soft:#FFF1D2;
  --num:'Chakra Petch', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --body:'IBM Plex Sans Thai', 'Noto Sans Thai', 'Leelawadee UI', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121717; --sheet:#1A2121; --ink:#E4EBE9; --muted:#97A4A2; --rule:#2C3636;
    --form:#E9759F; --form-soft:#3A2230; --graphite:#E4EBE9; --on-graphite:#121717;
    --right:#4FC48D; --right-soft:#16342A; --wrong:#F2805F; --wrong-soft:#3B211B;
    --hl:#5A4E16; --warn:#F0BE5A; --warn-soft:#382D14;
  }
}
:root[data-theme="dark"]{
  --paper:#121717; --sheet:#1A2121; --ink:#E4EBE9; --muted:#97A4A2; --rule:#2C3636;
  --form:#E9759F; --form-soft:#3A2230; --graphite:#E4EBE9; --on-graphite:#121717;
  --right:#4FC48D; --right-soft:#16342A; --wrong:#F2805F; --wrong-soft:#3B211B;
  --hl:#5A4E16; --warn:#F0BE5A; --warn-soft:#382D14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:2.5px solid var(--form);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1.5px solid var(--form)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.sheet-btn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--form);background:transparent;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;font-weight:500}
.sheet-btn .count{font-family:var(--num);font-weight:600}
.mini-bub{display:inline-flex;gap:3px}
.mini-bub i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--form)}
.mini-bub i:nth-child(2){background:var(--graphite);border-color:var(--graphite)}
.progress{height:3px;background:var(--rule)}
.progress span{display:block;height:100%;background:var(--form);width:0;transition:width .3s}

main{max-width:760px;margin:0 auto;padding:20px 16px 120px}

/* question head */
.qhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.qnum{font-family:var(--num);font-weight:700;font-size:44px;line-height:.9;color:var(--form)}
.fields{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.field{border:1.5px solid var(--form);border-radius:3px;padding:1px 8px;font-family:var(--num);font-weight:600;font-size:14px;letter-spacing:.03em}
.field b{font-weight:500;color:var(--muted);margin-right:5px;font-size:11px}
.stem{font-size:18px;line-height:1.7;margin:0 0 6px}
.gray{color:var(--muted);font-size:14.5px;line-height:1.6;margin:6px 0 0;padding-left:12px;border-left:2px solid var(--rule)}
.stem-img{margin:14px 0 4px;border:1px solid var(--rule);border-radius:4px;background:#fff;max-width:520px}
.stem-img img{display:block;width:100%;height:auto}
.stem-img img+img{border-top:1px solid var(--rule)}
.kimg{display:grid;gap:10px}
.kimg img{display:block;width:100%;max-width:640px;height:auto;border:1px solid var(--rule);border-radius:4px;background:#fff}
.img-missing{margin:14px 0 4px;padding:10px 12px;border:1px dashed var(--rule);border-radius:4px;font-size:13px;color:var(--muted)}
.img-note{font-size:12.5px;line-height:1.5;color:#5A6665;padding:6px 10px;background:#F4F6F3;border-top:1px solid var(--rule)}

/* options = OMR bubbles */
.opts{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--rule)}
.opt{display:flex;align-items:flex-start;gap:14px;padding:12px 6px;border-bottom:1px solid var(--rule);cursor:pointer;border-radius:4px;transition:background .15s}
.opt:hover{background:var(--form-soft)}
.opt[aria-disabled="true"]{cursor:default}
.opt[aria-disabled="true"]:hover{background:transparent}
.bub{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--form);display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:15px;color:var(--form);position:relative;transition:background .18s,color .18s,border-color .18s}
.opt .txt{padding-top:4px;flex:1}
.opt.sel .bub{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite);animation:fill .22s ease-out}
@keyframes fill{from{transform:scale(.82)}to{transform:scale(1)}}
.opt.correct{background:var(--right-soft)}
.opt.correct .bub{border-color:var(--right);color:var(--right);box-shadow:0 0 0 3px var(--right-soft),0 0 0 5px var(--right)}
.opt.correct.sel .bub{background:var(--right);color:#fff}
.opt.wrongpick{background:var(--wrong-soft)}
.opt.wrongpick .bub{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt.wrongpick .txt{text-decoration:line-through;text-decoration-color:var(--wrong)}
.opt.dim .txt{color:var(--muted)}

.actions{display:flex;gap:10px;margin-top:20px;align-items:center}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:500;font-size:16px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{border-color:var(--rule)}
.spacer{flex:1}
.hint{font-size:13px;color:var(--muted)}

/* explanation */
.exp{margin-top:28px;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px 2px 6px 6px;padding:20px 18px 8px;animation:reveal .35s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:6px}
.verdict .v{font-family:var(--num);font-weight:700;font-size:24px}
.verdict .v.ok{color:var(--right)} .verdict .v.no{color:var(--wrong)}
.verdict .ans{font-size:15.5px}
.tagline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.guide{flex-basis:100%;font-size:13px;line-height:1.55;padding:7px 10px;border-radius:4px;background:#EEF3FB;border:1px solid #C9D6EE;color:#26406B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .guide{background:#1B2638;border-color:#2E4266;color:#BFD0EE}}
.tag{font-size:13px;border-radius:4px;padding:2px 8px;border:1px solid var(--rule);color:var(--muted)}
.tag.rep{border-color:var(--form);color:var(--form);font-family:var(--num);font-weight:600;font-size:14px}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.sec{padding:14px 0;border-top:1px dashed var(--rule)}
.sec:first-of-type{border-top:0}
.sec h3{font-family:var(--body);font-size:14px;font-weight:600;color:var(--form);margin:0 0 6px;letter-spacing:.01em}
.sec p{margin:0}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.wrong-list{list-style:none;padding:0!important}
.wrong-list li{display:flex;gap:10px;margin:8px 0!important}
.wrong-list .l{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.notes{background:linear-gradient(transparent 0, transparent 0);}
.notes .box{background:var(--sheet);border-left:4px solid var(--hl);padding:2px 0 2px 12px}
.notes b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.notes figure{margin:12px 0 4px;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#fff;max-width:560px}
.notes figcaption{font-size:12px;color:#666;padding:4px 8px;background:#f4f4f4}
.opinion .box{background:var(--warn-soft);border-radius:4px;padding:10px 12px}
.trap .box{border-left:4px solid var(--wrong);padding-left:12px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:10px;padding:10px 16px;align-items:center}
.nav .pos{font-family:var(--num);font-weight:600;font-size:15px;color:var(--muted);flex:1;text-align:center}

/* answer sheet overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,14,.45);display:none}
.overlay.open{display:block}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.panel-h{padding:10px 16px 8px;border-bottom:1.5px solid var(--form)}
.panel-h .row{display:flex;align-items:center;gap:10px}
.panel-h h2{font-family:var(--num);font-size:20px;margin:0;flex:1}
.x{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;padding:4px 8px;color:var(--muted)}
.stats{display:flex;gap:18px;margin:6px 0 2px}
.stat .n{font-family:var(--num);font-weight:700;font-size:22px;line-height:1}
.stat .k{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:6px;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
.chips.scroll .chip{flex:none;white-space:nowrap}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;line-height:1.5;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rows{overflow:auto;flex:1;padding:6px 8px 16px}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:7px 8px;border-radius:4px;cursor:pointer;text-align:left}
.srow:hover{background:var(--form-soft)}
.srow.cur{background:var(--form-soft)}
.srow .n{font-family:var(--num);font-weight:600;width:40px;flex:none;text-align:right;color:var(--form)}
.srow .bs{display:flex;gap:7px}
.srow .b{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--form);font-family:var(--num);font-size:9.5px;display:grid;place-items:center;color:var(--form);opacity:.75}
.srow .b.f{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite);opacity:1}
.srow .b.f.ok{background:var(--right);border-color:var(--right);color:#fff}
.srow .b.f.no{background:var(--wrong);border-color:var(--wrong);color:#fff}
.srow .b.k{box-shadow:0 0 0 2px var(--right)}
.srow .meta{font-size:12px;color:var(--muted);margin-left:auto;font-family:var(--num)}
.panel-f{padding:6px 16px;border-top:1px solid var(--rule);display:flex;gap:10px;align-items:center}
.empty{padding:30px 16px;color:var(--muted);text-align:center}
.panel-f{flex-wrap:wrap;gap:4px}
.redo{margin-left:auto}
.optnote{display:block;margin-top:8px;font-size:.92em;color:var(--muted)}
.link{background:none;border:0;color:var(--wrong);text-decoration:underline;cursor:pointer;font-size:13px;padding:3px 4px}

@media (max-width:520px){
  body{font-size:16px}
  .qnum{font-size:38px}
  .stem{font-size:17px}
  .exp{padding:16px 14px 6px;margin-left:-4px;margin-right:-4px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* ---- website additions (home / rounds / notes / AI / account) ---- */
[hidden]{display:none!important}
/* stop mobile browsers from auto-enlarging some text blocks (iOS/Android text autosizing) */
html{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%}
.home-btn{border:0;background:transparent;font-size:24px;line-height:1;padding:2px 6px 4px;cursor:pointer;color:var(--form);flex:none}
.acct{flex:none;width:36px;height:36px;border:1.5px solid var(--rule);background:transparent;border-radius:50%;padding:0;font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center}
.brand.long{white-space:normal;line-height:1.2;font-size:16px}
@media (max-width:380px){.brand.long{font-size:15px}}
.acct.on{border-color:var(--right);color:var(--right)}
.h1{font-family:var(--num);font-weight:700;font-size:28px;line-height:1.2;margin:6px 0 2px}
.h2{font-family:var(--num);font-weight:700;font-size:22px;line-height:1.25;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.wcard{display:flex;gap:14px;align-items:center;padding:14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);text-decoration:none;color:var(--ink);margin-bottom:10px}
.wcard:hover{border-color:var(--form)}
.wcard .wb{font-family:var(--num);font-weight:700;color:var(--form);border:2px solid var(--form);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;flex:none;font-size:15px}
.wcard .wb{text-align:center;line-height:1.05;font-size:14px;padding:0 4px}
.wcard b{font-family:var(--num);font-size:17px}
.rd{display:block;color:var(--muted);font-size:13.5px;line-height:1.5;font-weight:400}
.whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.whead a{font-size:13.5px;color:var(--muted);margin-left:auto}
.tabs{display:flex;border-bottom:1.5px solid var(--rule);margin:10px 0 14px}
.tab{flex:1;border:0;background:transparent;padding:10px 0;font-family:var(--num);font-weight:600;font-size:15.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--form);border-color:var(--form)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:13px;cursor:pointer;line-height:1.35;color:var(--muted)}
.seg button b{font-family:var(--num);display:block;font-size:15.5px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"] b{color:var(--paper)}
.phase-hint{font-size:13.5px;color:var(--muted);margin:8px 2px 0;line-height:1.55}
.statline{font-size:13.5px;color:var(--muted);margin:12px 2px 0}
.statline b{font-family:var(--num);color:var(--ink)}
.rounds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:359px){.rounds{grid-template-columns:1fr}}
/* Long case: last row, one long box from the left column's left edge to the right column's right edge (MCQ / MEQ / OSCE, MDCU + SI) */
.rounds .round[data-round="longcase"],.rounds .round[data-mqround="longcase"]{grid-column:1/-1}
.round{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:12px 12px 12px;cursor:pointer;min-height:104px;position:relative}
.round:hover{border-color:var(--form)}
.round .rn{font-family:var(--num);font-weight:700;color:var(--form);font-size:13px;letter-spacing:.04em}
.round b{font-family:var(--num);font-size:16.5px;line-height:1.25}
.round[aria-disabled="true"]{opacity:.5;cursor:default}
.round[aria-disabled="true"]:hover{border-color:var(--rule)}
.round .soon,.round .badge{position:absolute;top:10px;right:10px;font-size:11.5px;border-radius:999px;padding:0 8px;line-height:1.6}
.round .soon{border:1px solid var(--rule);color:var(--muted)}
.round .badge{font-family:var(--num);font-weight:600;background:var(--form);color:#fff}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-top:14px}
.card h3{font-family:var(--num);font-size:16px;margin:0 0 4px;color:var(--form)}
.card .rd{margin-bottom:10px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{border:1.5px solid var(--rule);background:transparent;border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer;font-size:14px;line-height:1.4;color:var(--ink)}
.tool:hover{border-color:var(--form)}
.tool .n{font-family:var(--num);font-weight:700;float:right;margin-left:6px;color:var(--form)}
.tool.wide{grid-column:1/-1}
.resume{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--form);background:var(--form-soft);border-radius:8px;padding:10px 12px;margin-top:14px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.resume b{font-family:var(--num)}
.resume .go{margin-left:auto;font-family:var(--num);font-weight:700;color:var(--form)}
.flag{margin-left:auto;align-self:flex-start;border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.flag[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.sessbar{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--num);font-weight:600;letter-spacing:.02em}
.note{margin-top:4px}
.ntabs{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ntabs button{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:2px 12px;font-size:13px;cursor:pointer;min-height:30px;color:var(--ink)}
.ntabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.ntabs button.has::after{content:" •";color:var(--form)}
.nsaved{margin-left:auto;font-size:12px;color:var(--muted)}
.ntext,.field-in{width:100%;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:8px 10px;font:inherit;font-size:15.5px;line-height:1.6}
.ntext{min-height:96px;resize:vertical;display:block}
.ntext:focus,.field-in:focus{outline:none;border-color:var(--form)}
.inkbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.inkbar button{border:1.5px solid var(--rule);background:transparent;border-radius:6px;padding:3px 9px;font-size:13px;cursor:pointer;min-height:32px;color:var(--ink)}
.inkbar button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.inkbar [data-c][aria-pressed="true"]{background:transparent;color:inherit;border-color:var(--form);box-shadow:inset 0 0 0 1.5px var(--form)}
.inkbar .dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px}
.inkbar .sep{flex:1}
canvas.ink{display:block;width:100%;height:220px;touch-action:none;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet) repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);cursor:crosshair}
details.pre{margin-top:18px;border:1px dashed var(--rule);border-radius:6px;padding:8px 10px}
details.pre>summary{cursor:pointer;font-size:14.5px;color:var(--form);font-weight:600;list-style:none}
details.pre>summary::-webkit-details-marker{display:none}
details.pre>summary::before{content:"▸ ";}
details.pre[open]>summary::before{content:"▾ ";}
details.pre[open]>summary{margin-bottom:8px}
.mine{background:var(--form-soft);border-radius:6px;padding:10px 10px 12px;margin:0 -4px}
.mine h3{margin-bottom:2px}
.ask .qchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.ask .ntext{min-height:70px}
.ask .row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.score{font-family:var(--num);font-size:52px;font-weight:700;color:var(--form);line-height:1}
.yr{margin:14px 0 4px}
.yr .yh{font-family:var(--num);font-weight:700;font-size:15px;margin-bottom:6px}
.chip .c{font-family:var(--num);font-size:11.5px;opacity:.75;margin-left:4px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hy-topic{border-top:1px dashed var(--rule);padding:12px 0}
.hy-topic:first-child{border-top:0}
.hy-topic h3{font-family:var(--num);font-size:16px;margin:0 0 6px}
.qref{border:1px solid var(--form);color:var(--form);background:transparent;border-radius:4px;padding:0 6px;font-family:var(--num);font-size:12.5px;cursor:pointer;margin:0 2px}
details.grp{border-top:1px solid var(--rule);padding:8px 0}
details.grp>summary{cursor:pointer;font-family:var(--num);font-weight:600}

details.grp li{margin:6px 0}
.kw{width:100%;border-collapse:collapse;font-size:14.5px}
.kw th{font-family:var(--num);text-align:left;color:var(--form);border-bottom:1.5px solid var(--form);padding:6px 4px}

.kw td:first-child{font-weight:600;white-space:nowrap}
.err{color:var(--wrong);font-size:13.5px;min-height:1em}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--rule)}
.linkbtn{background:none;border:0;color:var(--form);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px 0}
/* ---- rounds v2: morning clock, unit, quality timer, admission ---- */
.round .mclock{margin-top:6px;font-size:12.5px;color:var(--muted)}
.round .mclock b{font-family:var(--num);font-size:13px;color:var(--form);font-variant-numeric:tabular-nums}
.stack .resume{margin-top:0}
.qprog[aria-pressed="true"]{border-color:var(--form);background:var(--form-soft)}
.qprog .tag{font-size:11px;vertical-align:1px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;line-height:1.55;color:var(--ink)}
.chk input{width:20px;height:20px;flex:none;margin-top:2px}
.qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.qrow.end{justify-content:flex-end}
.qrow .field-in{flex:1;min-width:120px;padding:6px 8px}
.qrow .field-in.num{flex:0 0 76px;min-width:0}
.qrow .field-in.sel{flex:1 1 130px;min-width:0;padding:6px 6px;font-size:14.5px}
.qrow .chip:disabled{opacity:.35}
.qphase{border-top:1px dashed var(--rule);margin-top:10px;padding-top:2px}
.qe h3{margin-bottom:2px}
.fl{display:block;font-family:var(--num);font-weight:600;font-size:14.5px}
.fl .field-in{margin-top:4px;font-family:var(--body);font-weight:400}
/* Quality round timer: vertical rail on the right edge, so the question keeps the full height of the screen */
.qbar{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:16;width:70px;max-height:calc(100vh - 170px);overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 6px;padding-right:calc(6px + env(safe-area-inset-right,0px));
  background:var(--paper);border:1px solid var(--rule);border-right:0;border-radius:12px 0 0 12px;box-shadow:-2px 2px 10px rgba(0,0,0,.08);text-align:center}
.qbar[hidden]{display:none}
.qb-main{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.qb-t{font-family:var(--num);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.qb-ph{font-family:var(--num);font-weight:700;font-size:12.5px;line-height:1.2;color:var(--form);overflow-wrap:anywhere}
.qb-meta{font-size:10.5px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere;border-top:1px dashed var(--rule);padding-top:6px}
.qb-btns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.qb-btns .chip{min-height:32px;padding:3px 4px;border-radius:8px;font-size:12px;line-height:1.15;justify-content:center;text-align:center;white-space:normal}
.qb-vol{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;padding-top:2px}
.qb-vs{display:block;width:28px;height:96px;position:relative}
.qb-vs input{accent-color:var(--form);position:absolute;left:50%;top:50%;width:96px;margin:0;transform:translate(-50%,-50%) rotate(-90deg)}
.qbar[data-k="q"] .qb-t,.qbar[data-k="warm"] .qb-t{color:var(--form)}
.qbar[data-k="sol"] .qb-ph{color:var(--right)}
.qbar[data-k="done"] .qb-ph{color:var(--muted)}
@media (max-width:920px){.qon main{padding-right:calc(84px + env(safe-area-inset-right,0px))}}
.spin{width:28px;height:28px;border:3px solid var(--rule);border-top-color:var(--form);border-radius:50%;margin:12px 0 2px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.resume.qprog{background:var(--sheet);border-color:var(--rule)}
.resume.qprog[aria-pressed="true"]{border-color:var(--form);background:var(--form-soft)}
.tag{overflow-wrap:anywhere;word-break:break-word}
/* ---------- Advisor round ---------- */
.lbl{font-family:var(--num);font-weight:700;font-size:15px;margin:16px 0 6px}
.lbl .hint{font-family:var(--body);font-weight:400;font-size:12.5px;margin-left:4px}
.verdict .v.new{color:var(--muted)}
.sec.adv{border-top:1px solid var(--form);background:var(--form-soft);margin:10px -12px 0;padding:14px 12px;border-radius:6px}
.sec.adv ul{margin:6px 0}
.sec.adv .box{background:var(--sheet);border-left:4px solid var(--wrong);border-radius:4px;padding:8px 12px;margin-top:8px;overflow-wrap:anywhere}
.sec.adv .box.trapbox{border-left-color:var(--warn)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.hb{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--num);font-size:12.5px;font-weight:700;color:#fff}
.hb.ok{background:var(--right)} .hb.no{background:var(--wrong)}
.wrong-list li.picked .l{border-color:var(--wrong);background:var(--wrong);color:#fff}
.youpick{color:var(--wrong);font-size:12.5px}
.aiout{margin-top:8px;overflow-wrap:anywhere}
.aiout h4{font-family:var(--num);font-size:15px;margin:12px 0 4px}
.aiout ul{margin:4px 0;padding-left:20px} .aiout li{margin:3px 0} .aiout p{margin:6px 0}
.tbars{margin-top:8px}
.tbar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.tbar .tn{overflow-wrap:anywhere;line-height:1.25}
.tbar .tt{height:10px;background:var(--rule);border-radius:999px;overflow:hidden}
.tbar .tt i{display:block;height:100%;background:var(--wrong);border-radius:999px;min-width:2px}
.tbar .tv{font-family:var(--num);font-size:12.5px;color:var(--muted);min-width:3.2em;text-align:right}
details.tcard>summary{line-height:1.6}
details.tcard>summary .tag{font-family:var(--body);font-weight:400}
.tline{margin:6px 0 0;font-size:14.5px}
.tsub{font-family:var(--num);font-weight:600;font-size:13.5px;color:var(--form);margin:12px 0 0}
details.tcard .tools{margin-top:10px}
/* ---------- Service round: set progress ---------- */
.chip.svchip:not([aria-pressed="true"]){background-image:linear-gradient(to right,var(--right-soft) var(--pc),transparent var(--pc))}
.chip.svchip.done{border-color:var(--right)}
.chip.svchip.done:not([aria-pressed="true"]) .c{color:var(--right);opacity:1;font-weight:600}
/* ---------- Legendary round ---------- */
.exnav{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:8px 16px 0}
.exnav .ext{font-family:var(--num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--ink)}
.exnav .ext.low{color:var(--wrong)}
.exnav .exn{font-size:13.5px;color:var(--muted);flex:1;min-width:0}
.exnav .exsub{padding:6px 14px;min-height:36px;font-size:14px}
.flag.star[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.tag.starTag{border-color:var(--warn);color:var(--warn)}
.row2.center{justify-content:center}
.gradebox{display:flex;flex-direction:column;align-items:center;margin:18px auto 6px;width:150px;height:150px;border-radius:50%;justify-content:center;border:4px solid currentColor}
.gradebox .k{font-family:var(--num);font-size:14px;letter-spacing:.08em;color:var(--muted)}
.gradebox .g{font-family:var(--num);font-weight:700;font-size:64px;line-height:1}
.ga{color:var(--right)} .gb{color:#2F7FB8} .gc{color:var(--warn)} .gd{color:#C0662C} .gf{color:var(--wrong)}
.lgg{font-family:var(--num);font-weight:700;font-size:18px;width:40px;flex:none;text-align:center}
/* ---------- Long case round ---------- */
.lcintro p{font-size:16px;line-height:1.6}
.lcstep h3{color:var(--form)}
.lcstep .ntext{margin-top:8px;min-height:96px}
.lcmine{background:var(--paper);border-radius:4px;padding:8px 10px;margin-top:8px;overflow-wrap:anywhere}
.lcinfo,.lcans{margin-top:10px;overflow-wrap:anywhere}
.lcinfo{border-left:4px solid var(--hl);padding-left:10px}
.lcans{border-left:4px solid var(--right);padding-left:10px}
.lcinfo ul,.lcans ul{margin:4px 0;padding-left:20px} .lcinfo p,.lcans p{margin:4px 0}
/* ---------- seen elsewhere ---------- */
.field.seen{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.field.seen b{color:var(--warn)}
.field.seen.rel{border-style:dashed}
.field.seen.new{border-color:var(--rule);color:var(--muted);background:transparent}
.field.seen.new b{color:var(--muted)}
.seenbox{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:4px;padding:8px 10px;margin:8px 0;font-size:14px;overflow-wrap:anywhere}
.seenbox>div{margin:3px 0}
.seenbox .hgrp{display:inline-flex;align-items:center;gap:4px;margin-right:10px;flex-wrap:wrap}
.legban{position:sticky;top:52px;z-index:14;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto;padding:8px 16px;background:var(--warn-soft);border-bottom:1px solid var(--warn);font-size:14px}
.legban span{flex:1;min-width:0}
.legban .btn{padding:4px 12px;min-height:32px;font-size:13.5px}
/* ---------- subject tags ---------- */
.ttags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px}
.ttags .tl{font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--muted)}
.ttags .tt{font-size:12.5px;line-height:1.4;padding:2px 9px;border-radius:999px;background:var(--form-soft);color:var(--form);overflow-wrap:anywhere}
/* sprite images (Claude artifact build) — sized like the <img> they replace */
.spr{display:block;background-repeat:no-repeat;background-color:#fff}
.stem-img .spr{width:100%!important}
.stem-img .spr+.spr{border-top:1px solid var(--rule)}
.kimg .spr{width:100%!important;max-width:640px;border:1px solid var(--rule);border-radius:4px}
figure .spr{width:100%!important}
/* Legendary: AI writing new questions before the paper starts */
.lgai{margin-top:12px;padding:12px 14px;border-left:4px solid var(--form);background:var(--form-soft);border-radius:4px;font-size:14px;line-height:1.6;color:var(--ink)}
.lbadge{font-family:var(--num);font-weight:600;background:var(--form);color:#fff;border-radius:999px;padding:0 8px;font-size:11.5px;line-height:1.6;margin-right:6px}
/* Legendary history */
.lhstat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12.5px;color:var(--muted)}
.lhstat b{display:block;font-family:var(--num);font-size:20px;color:var(--ink)}
.lhtrend{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;justify-content:center}
/* Legendary: exam size of this ward, made prominent */
.round .rcnt{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}.round .rcnt b{color:inherit;font-weight:700;font-size:inherit}
.round .lgspec{display:block;margin-top:6px;font-family:var(--num);font-size:15px;color:var(--form)}
.round .lgspec b{font-size:19px;font-weight:700}
.lgbig{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:4px 0 14px;padding:12px 16px;border-radius:12px;background:var(--form-soft);color:var(--form);font-family:var(--num);font-size:18px}
.lgbig b{font-size:34px;font-weight:700;line-height:1}
.lgbig .w{flex-basis:100%;font-size:13px;color:var(--muted)}
.lgbig .dot{color:var(--muted)}
.lhtrend .lgg{display:inline-block;width:auto;min-width:30px;font-size:14px;padding:2px 6px;border-radius:6px;background:var(--sheet)}
/* exam dates + countdown */
.exdates{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
.exd{display:inline-flex;align-items:baseline;gap:8px;padding:6px 12px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule);font-size:13.5px;color:var(--ink)}
.exd .k{font-weight:600}.exd .v{color:var(--muted)}
.exd b{font-family:var(--num);font-size:17px;color:var(--form)}
.exd.hot{border-color:var(--wrong);background:var(--wrong-soft)}.exd.hot b{color:var(--wrong)}
.p2warn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px;padding:12px 14px;border-radius:10px;background:var(--wrong);color:#fff;font-size:15px;line-height:1.5}
.p2warn b{flex:1 1 220px}.p2warn .btn{background:#fff;color:var(--wrong);border-color:#fff}
.wcd{display:block;margin-top:3px;font-size:13px;color:var(--muted)}.wcd b{font-family:var(--num);color:var(--form)}
.wcd.hot,.wcd.hot b{color:var(--wrong)}
.exd.done{border-color:var(--right);background:var(--right-soft)}.exd.done b{color:var(--right)}
.wcd.done b{color:var(--right)}
/* grades */
.grrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--rule);font-size:14.5px}
.grcard h3+.grrow{border-top:0}
.grsel{width:auto;min-width:76px;padding:6px 8px}.grin{width:120px;padding:6px 8px;text-align:right}
.grtab{width:100%;border-collapse:collapse;font-size:14.5px}
.grtab th,.grtab td{padding:10px 8px;border-top:1px solid var(--rule);text-align:center}
.grtab thead th{border-top:0;font-family:var(--num);font-size:13px;color:var(--muted);font-weight:600}
.grtab tbody th{text-align:left;font-weight:600;cursor:pointer}
.grtab tr[data-gw]:hover{background:var(--sheet)}
.grsc{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.grg{font-family:var(--num);font-weight:700;font-size:18px}
.grline{display:flex;align-items:baseline;gap:8px;width:100%;margin:-4px 0 12px;padding:8px 12px;border:1.5px solid var(--form);border-radius:8px;background:var(--form-soft);font:inherit;font-size:13.5px;color:var(--ink);text-align:left;cursor:pointer}
.grline span{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grline .go{flex:none;color:var(--form)}
.wgr{margin-left:auto;flex:none;display:flex;flex-direction:column;align-items:center;min-width:30px;font-family:var(--num);font-weight:700;font-size:16px;line-height:1.3}
.wcd b,.exd b{white-space:nowrap}
/* Morning round not finished today */
.round.mwarn{border-color:var(--wrong);background:var(--wrong-soft)}
.round .mtodo{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--wrong)}
/* Update for all */
.ufa{display:flex;flex-direction:column;gap:4px;margin:14px 0 4px;flex-basis:100%}
.ufab{border-color:var(--form);color:var(--form);font-weight:600}
.resitem{margin:6px 0 10px}.resitem ul{margin:4px 0 0}
/* Morning round history */
.round .mhist{margin-top:6px;font-size:12.5px;color:var(--form);text-decoration:underline;text-underline-offset:2px}
.mhsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;text-align:center}
.mhsum b{display:block;font-family:var(--num);font-size:22px;line-height:1.1}.mhsum b.bad{color:var(--wrong)}
.mhsum span{font-size:12px;color:var(--muted)}
.mhlist{display:flex;flex-direction:column;gap:6px}
.mhrow{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:9px 11px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
details.mhrow{display:block}
details.mhrow>summary{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;cursor:pointer;list-style:none}
details.mhrow>summary::-webkit-details-marker{display:none}
details.mhrow>summary::after{content:"▾";margin-left:auto;color:var(--muted);order:1}
.mhrow .mhr{order:2}
details.mhrow[open]>summary::after{content:"▴"}
.mhd{font-family:var(--num);font-weight:700;min-width:96px}.mhd.now{color:var(--form)}
.mhs{font-size:12.5px;border-radius:10px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.mhs.ok{color:var(--right)}.mhs.part{color:var(--warn)}.mhs.miss{color:var(--wrong)}.mhs.fut{color:var(--muted);border-style:dashed}
.mhr{flex-basis:100%;font-size:12.5px;color:var(--muted)}.mhr b{color:var(--ink)}
.mhq{margin:8px 0 2px;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.mhopen{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:1px solid var(--rule);border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--ink);font:inherit}
.mhsrc{font-size:11.5px;color:var(--muted)}.mhst{font-size:13.5px;line-height:1.45}
.mhx{font-size:12.5px;font-weight:700}.mhx.ok{color:var(--right)}.mhx.no{color:var(--wrong)}.mhx.na{color:var(--muted);font-weight:400}
/* exam date editor */
.exedit{align-self:center;font-size:13px;color:var(--form);text-decoration:underline;text-underline-offset:2px;padding:4px 2px}
.dtrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 10px;padding:10px 0;border-bottom:1px dashed var(--rule)}
.dtrow:last-child{border-bottom:0}
.dtrow label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.dtrow label.ck{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.dtrow input[type=date],.dtrow input[type=time],.dtrow select{font:inherit;font-size:15px;padding:6px 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.dtmv{display:flex;gap:4px}.dtmv .btn{padding:4px 10px;min-height:0;font-size:13px;line-height:1.2}
.dtmv{align-items:center}
.dtgrip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:1.5px dashed var(--rule);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted);background:var(--sheet)}
.dtrow.drag{background:var(--sheet);box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:8px;position:relative;z-index:2}
.dtrow.drag .dtgrip{cursor:grabbing;border-color:var(--form);color:var(--form)}
/* password gate */
body.gated header.bar,body.gated #legban,body.gated .nav,body.gated .qbar{display:none!important}
.gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;max-width:320px;margin:0 auto;padding:0 16px}
.gate .gl{font-size:34px;opacity:.55}
.gate input{width:100%;font:inherit;font-size:17px;padding:11px 14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);text-align:center}
.gate .btn{width:100%}
.gate .gerr{color:var(--wrong);font-size:14px;margin:0}

/* ===== MEQ (site/meq.js) — ported from meq-platform-kit, scoped under .mqv ===== */
.mqv .case-tag{border-color:var(--ink)!important}
.mqv .qhead{flex-wrap:wrap}
.mqv .qhead .fields{flex:1;min-width:0}
.mqv .qtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto;padding-bottom:4px;flex:none}
.mqv .timer{white-space:nowrap;font-family:var(--num);font-weight:600;font-size:14px;color:var(--muted);border:1.5px solid var(--rule);border-radius:3px;padding:1px 8px}

.mqv .starbtn{border:1.5px solid var(--rule);background:transparent;border-radius:3px;padding:0 8px;font-size:16px;line-height:1.5;cursor:pointer;color:var(--muted)}
.mqv .starbtn[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.mqv .stem table,.mqv .subq table,.mqv .exp table{border-collapse:collapse;margin:8px 0;font-size:15px}
.mqv .stem td,.mqv .stem th,.mqv .subq td,.mqv .subq th,.mqv .exp td,.mqv .exp th{border:1px solid var(--rule);padding:3px 8px;text-align:left}
.mqv .subq{margin:22px 0 0;padding-top:16px;border-top:1px solid var(--rule)}
.mqv .subq .sh{display:flex;gap:10px;align-items:baseline}
.mqv .subq .sn{font-family:var(--num);font-weight:700;color:var(--form);font-size:19px;flex:none;min-width:34px}
.mqv .subq .sq{flex:1;font-size:17px;line-height:1.65}
.mqv .subq .mk{font-size:12px;color:var(--muted);flex:none;font-family:var(--num);border:1px solid var(--rule);border-radius:3px;padding:0 6px}

.mqv textarea.ans{display:block;width:calc(100% - 44px);margin:10px 0 0 44px;min-height:84px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:inherit;font-size:16px;line-height:1.55;resize:vertical}
.mqv textarea.ans:focus{border-color:var(--form);outline:none;box-shadow:0 0 0 3px var(--form-soft)}
.mqv .sbody{margin-left:44px}
.mqv .mmine{margin-top:10px;padding:8px 12px;border-left:3px solid var(--graphite);white-space:pre-wrap;font-size:15.5px;background:var(--sheet);border-radius:0 4px 4px 0}

.mqv .mmine .lab{color:var(--muted)}
.mqv .mmine.none{color:var(--muted);font-style:italic}
.mqv .model{margin-top:10px;background:var(--right-soft);border:1px solid var(--right);border-radius:6px;padding:10px 12px;animation:reveal .35s ease-out}
.mqv .model .lab{color:var(--right)}

.mqv .model .mexp{margin-top:8px;font-size:15.5px}
.mqv .model .mexp ul,.mqv .model .mexp ol{margin:4px 0;padding-left:20px}
.mqv .pts{list-style:none;padding:0;margin:10px 0 0}

.mqv .pts label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:15.5px}
.mqv .pts input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--right)}
.mqv .pts .ph{font-size:12px;font-weight:600;color:var(--right);letter-spacing:.03em}
.mqv .grade{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.mqv .grade .gl{font-size:13px;color:var(--muted);flex-basis:100%}
.mqv .mgbtn{white-space:nowrap;border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 12px;font-size:14px;cursor:pointer}
.mqv .mgbtn.g2[aria-pressed="true"]{background:var(--right);border-color:var(--right);color:#fff}
.mqv .mgbtn.g1[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.mqv .mgbtn.g0[aria-pressed="true"]{background:var(--wrong);border-color:var(--wrong);color:#fff}
.mqv .sub-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mqv .mscore{font-family:var(--num);font-weight:700;font-size:24px}
.mqv .srow .b.f.half{background:var(--warn);border-color:var(--warn);color:#fff}
.mqv .srow .more{font-size:11px;color:var(--muted);font-family:var(--num)}
.mqv .srow .st{color:var(--warn);font-size:13px}
@media (max-width:520px){.mqv .qtools{order:3;flex-basis:100%;margin-left:0;padding-bottom:0}}
.mqv .qnum small{display:block;font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);line-height:1.2;margin-bottom:2px}
.mqv .psteps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.mqv .pstep{font-family:var(--num);font-weight:600;font-size:14px;border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:2px 12px;cursor:pointer;color:var(--ink)}
.mqv .pstep.done{border-color:var(--right);color:var(--right)}
.mqv .pstep.open{border-color:var(--form);color:var(--form)}
.mqv .pstep.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.mqv .case{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px 12px}

.mqv details.prev{margin:12px 0 0;border:1px dashed var(--rule);border-radius:6px;padding:6px 12px}

.mqv .pinfo .pn{flex:none;font-family:var(--num);font-weight:700;color:var(--form);min-width:30px}
.mqv .pinfo>div{min-width:0}
.mqv section.part{margin-top:22px;border-top:3px solid var(--form);padding-top:12px}
.mqv .part-h{display:flex;align-items:baseline;gap:10px}
.mqv .pnum{font-family:var(--num);font-weight:700;font-size:22px;color:var(--form)}
.mqv .part-h .mk{font-size:12px;color:var(--muted);font-family:var(--num);border:1px solid var(--rule);border-radius:3px;padding:0 6px}
.mqv .pinfo-cur{margin-top:8px;font-size:17px;line-height:1.7}
.mqv .pinfo-cur table,.mqv .pinfo table{border-collapse:collapse;margin:8px 0;font-size:15px}
.mqv .pinfo-cur td,.mqv .pinfo-cur th,.mqv .pinfo td,.mqv .pinfo th{border:1px solid var(--rule);padding:3px 8px;text-align:left}
.mqv .subq .sn{min-width:52px}
.mqv textarea.ans{width:calc(100% - 62px);margin-left:62px}
.mqv .sbody,.mqv .subq .stem-img{margin-left:62px}
.mqv .sgray{margin-left:62px}

.mqv .nextpart{margin-left:auto}
.mqv .exp-h{font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.mqv .crow{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;padding:8px;border-radius:4px;align-items:start}
.mqv .crow.cur{background:var(--form-soft)}

.mqv .crow .cn:hover{background:var(--form-soft)}
.mqv .cparts{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.mqv .pchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:3px 7px;cursor:pointer}

.mqv .pchip .b.f.ok{background:var(--right);border-color:var(--right);color:#fff}
.mqv .pchip .b.f.half{background:var(--warn);border-color:var(--warn);color:#fff}
.mqv .pchip .b.f.no{background:var(--wrong);border-color:var(--wrong);color:#fff}
.mqv .cmeta{grid-column:2;font-size:12px;color:var(--muted);font-family:var(--num)}
.mqv .cmeta .st{color:var(--warn)}
@media (max-width:520px){.mqv .subq .sn{min-width:0}
.mqv textarea.ans{width:100%;margin-left:0}
.mqv .sbody,.mqv .subq .stem-img,.mqv .sgray{margin-left:0}
.mqv .pnum{font-size:20px}
.mqv .case{padding:10px 12px}}

.mqv .rubric{margin-top:6px;font-size:14.5px;color:var(--ink)}

.mqv .ailink{color:var(--form);font-size:14px}
.mqv .mmine-lab{margin:10px 0 0 62px;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--muted)}

.mqv .pts .pgrp{margin:8px 0 6px}

.mqv .grade .sredo{margin-left:auto;color:var(--muted);font-size:13px}
.mqv .pverdict .predo{color:var(--muted)}
.mqv .sact{margin:8px 0 0 62px}
@media (max-width:520px){.mqv .sact{margin-left:0}}

.mqv .oldtag,.mqv .newtag{display:inline-block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:999px;padding:0 8px;vertical-align:2px}
.mqv .oldtag{color:var(--muted);border:1px solid var(--rule)}

.mqv .aiold{margin-top:6px}

.mqv .chip .cnt{font-family:var(--num);font-size:11.5px;opacity:.7;margin-left:4px}
