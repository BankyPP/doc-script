A({page:4, orig:"15",
  stem:"A male newborn born at 37 weeks of gestation develops jaundice at 18 hours after birth. Microbilirubin is 17 mg/dL and hematocrit is 37%. The phototherapy and exchange transfusion nomograms are provided. What is the most appropriate treatment?",
  gray:"15. A male newborn GA 37 week has jaundice 18 hours after birth. Microbilirubin 17 mg/dL, Hct 37%. ให้กราฟ phototherapy, exchange transfusion มา What is the most appropriate treatment? — A. Phototherapy B. Partial blood exchange C. Total blood exchange D. Observe",
  opts:["Phototherapy","Partial blood exchange","Total blood exchange","Observe","Increase breastfeeding frequency"],
  ans:2, key:"C Total blood exchange"+KS,
  flag:"⚠ ต้นฉบับมี 4 ช้อย (A–D) — เติมช้อย E เป็นตัวลวง · ข้อสอบจริงให้กราฟ AAP มา ตัวเลขในเฉลยอ่านจากกราฟ AAP 2022 โดยประมาณ",
  interp:"เหลืองตอน <b>18 ชม.</b> (ยังไม่ถึง 24 ชม. → hemolysis) ใน <b>GA 37 wk</b> (GA &lt;38 wk = neurotoxicity risk factor) · Hct 37% ต่ำกว่าปกติ (45–65%) เข้ากับ hemolysis · ต้องเทียบ MB 17 กับกราฟเกณฑ์ exchange",
  why:"ขั้นตอนอ่านกราฟ AAP 2022: (1) เลือกกราฟ — GA 37 wk เป็น <b>neurotoxicity risk factor ในตัวเอง</b> (GA &lt;38 wk) และเหลืองก่อน 24 ชม. + Hct 37% ชี้ hemolytic disease → ใช้กราฟ <b>\"with ≥1 risk factor\"</b> (2) เลือกเส้น 37 wk (3) อายุ 18 ชม. → เกณฑ์ exchange ของกลุ่มนี้ตอน 24 ชม. ≈ 16–17 mg/dL (≥38 wk ≈ 18) และตอน 18 ชม. ต่ำกว่านั้น → <b>MB 17 ตอน 18 ชม. ถึง/เกินเกณฑ์ exchange</b> → <b>total (double-volume) exchange transfusion</b> · ระหว่างเตรียมเลือดให้ intensive phototherapy + IV hydration, ส่ง TB/DB/albumin/blood group/DAT/crossmatch · อัตราเพิ่ม ≈ 17 ÷ 18 ≈ 0.9 mg/dL/ชม. (&gt;0.3) เข้ากับ hemolysis · หลัง exchange ตามด้วย phototherapy ต่อและติดตาม TSB ทุก 4–6 ชม.",
  wrong:["Phototherapy อย่างเดียวพอเมื่อ TSB อยู่ระหว่างเกณฑ์ phototherapy กับระดับ escalation — ข้อนี้ถึงเกณฑ์ exchange แล้ว (แต่ต้องให้ intensive phototherapy ระหว่างรอเลือด) · ถ้าใช้กราฟ no risk factor ผิด ๆ จะเห็นว่ายังไม่ถึงเกณฑ์ exchange แล้วตอบช้อยนี้","Partial exchange (เอาเลือดออกแล้วเติม NSS) ใช้ลด Hct ใน <b>symptomatic polycythemia</b> (venous Hct ≥65%) ไม่ได้ลด bilirubin — ทารกนี้ Hct 37% ซีดด้วยซ้ำ การ partial exchange ด้วย NSS จะทำให้ซีดมากขึ้น","Observe ผิด — เหลืองก่อน 24 ชม. เป็น pathologic เสมอ และ bilirubin ถึงระดับ exchange เสี่ยง kernicterus · observe ใช้เมื่อ TSB ต่ำกว่าเกณฑ์ phototherapy มากและไม่มี risk factor (นัดตรวจซ้ำตามช่วงห่างจากเกณฑ์)","เพิ่มความถี่การให้นม (8–12 มื้อ/วัน) แก้ <b>breastfeeding jaundice</b> (กินนมไม่พอ น้ำหนักลดมาก day 3–5) และลด enterohepatic circulation — ไม่ใช่การรักษาของ hemolysis ที่เกิดตั้งแต่ 18 ชม. และไม่พอเมื่อ TSB ถึงเกณฑ์ exchange"],
  trap:"อย่าใช้กราฟ \"no risk factor\" กับเด็ก 37 wk — <b>GA &lt;38 wk เป็น risk factor ในตัวเอง</b> ทำให้เกณฑ์ต่ำลง · และอย่าอ่านเกณฑ์ที่อายุ 24 ชม. แทน 18 ชม. (กราฟชันช่วงแรก อ่านผิดไม่กี่ชั่วโมงเกณฑ์ต่างกันหลาย mg/dL)",
  summary:["อ่านกราฟ AAP 2022: เลือกกราฟตาม <b>มี/ไม่มี neurotoxicity risk factor</b> → เลือกเส้นตาม GA (≥38, 37, 36, 35 wk) → แกน X อายุเป็นชั่วโมง → เทียบ TSB/MB","Neurotoxicity risk factors: GA &lt;38 wk (ยิ่ง preterm ยิ่งเสี่ยง), albumin &lt;3 g/dL, isoimmune หรือ non-immune hemolytic disease (G6PD), sepsis, clinical instability ใน 24 ชม.","ลำดับการตัดสินใจ: ต่ำกว่าเกณฑ์ phototherapy → F/U ตามช่วงห่าง · ถึงเกณฑ์ phototherapy → phototherapy · ภายใน 2 mg/dL ของเกณฑ์ exchange (escalation of care) → intensive phototherapy + IV hydration + เตรียม exchange (TB, DB, crossmatch) + TSB ทุก 2 ชม. · ถึงเกณฑ์ exchange → exchange transfusion","เกณฑ์ exchange 2022 (ตารางสไลด์): 24 ชม. 16–18 · 48 ชม. 18–20 mg/dL (มี risk factor / GA น้อยใช้ค่าล่าง) — สูงกว่า 2004 (15–19, 17–23) ที่ใช้ 3 เส้น low/medium/high risk","สาเหตุตามเวลาเริ่มเหลือง (สไลด์): &lt;24 ชม. hemolysis · 24–48 ชม. G6PD, sepsis · day 3–5 breastfeeding jaundice (excessive weight loss), bruising (subgaleal/cephalohematoma), enterohepatic circulation ↑, polycythemia, sepsis · &gt;day 5 BM jaundice (exclusive breast feeding + normal weight gain), cephalohematoma, sepsis · &gt;2 wk BF/BM jaundice, sepsis, congenital hypothyroid, biliary atresia (acholic stool), Gilbert, Crigler-Najjar","Exchange transfusion: double volume ≈ 160–170 mL/kg (term) เอา bilirubin ออก ~50% และ antibody-coated RBC ออก ~85% · ภาวะแทรกซ้อน: thrombocytopenia, hypocalcemia, hyperkalemia, NEC, infection, portal vein thrombosis"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"newborn GA 37 week\" · วงกรอบ \"18 hours\" ลูกศร → <b>hemolysis</b> · ไฮไลต์ \"Microbilirubin 17 mg/dL\" · ข้างช้อยเขียน <b>exchange 18 · 20</b> (เกณฑ์ exchange 2022 ที่ 24 ชม. / 48 ชม.) · ไฮไลต์ช้อย C<br>สไลด์หน้า 3: กราฟ phototherapy/exchange 2022 แยก \"No hyperbilirubinemia neurotoxicity risk factors\" กับ \"One or more risk factors\" (ไฮไลต์หัวกราฟ) · กราฟ exchange แบบมี risk factor ระบุจุด 18 และ 16 ที่ 24 ชม. (≥38 wk / 35 wk) และ 20 / 18 ที่ 48 ชม. · ตาราง exchange วง <b>16–18</b> และ <b>18–20</b> (2022) · Escalation-of-care threshold <b>is 2 mg/dL below exchange level</b>",
  kimg:KI("04b","03c","03a"), guide:G22,
  mnemonic:"\"37 ยังไม่ถึง 38 = มี risk\" → ใช้กราฟเกณฑ์ต่ำ · exchange (มี risk factor) ≈ <b>24 ชม. 18 · 48 ชม. 20</b>",
  opinion:"เห็นด้วยกับผู้จด (C) มั่นใจปานกลาง–สูง — ข้อสอบจริงให้กราฟมา คำตอบขึ้นกับการเลือกกราฟ: ถ้าเลือกกราฟ \"มี risk factor\" (ถูกต้อง เพราะ GA 37 wk และสงสัย hemolysis) MB 17 ตอน 18 ชม. ถึงเกณฑ์ exchange · ถ้าใช้กราฟ no risk factor จะยังอยู่ในช่วง phototherapy/escalation — ตัวเลขในเฉลยอ่านจากกราฟ AAP 2022 โดยประมาณ · ช้อย E แต่งเพิ่มไม่เปลี่ยนคำตอบ",
  variants:["อายุ 48 ชม. GA 39 wk ไม่มี risk factor TSB 15 mg/dL → phototherapy (ยังห่างเกณฑ์ exchange ≈ 22)","GA 37 wk อายุ 24 ชม. TSB 15 (ภายใน 2 mg/dL ของเกณฑ์ exchange) → escalation of care: intensive phototherapy + IV hydration + crossmatch + TSB ทุก 2 ชม.","ถาม risk factor ข้อใดทำให้ต้องใช้กราฟเกณฑ์ต่ำ → GA &lt;38 wk / albumin &lt;3 g/dL / DAT บวก / sepsis"]}),
A({page:4, orig:"17",
  stem:"A 2-day-old male newborn presents with mild jaundice. His mother's blood group is O, Rh-positive. The boy's blood group is A. Laboratory investigation: CBC normal, microbilirubin 18 mg/dL, direct bilirubin 1 mg/dL, direct antiglobulin test weakly positive. Peripheral blood smear shows polychromasia. What is the cause of this condition?",
  gray:"17. A male newborn, 2 days old, is presented with mild jaundice. His mother blood group is O, Rh+. The boy's blood group is A. Laboratory investigation: CBC normal, microbilirubin 18 mg/dL, direct bilirubin 1 mg/dl, direct antiglobulin test weakly positive, PBS: polychromasia. What is the cause of this condition? — A. Thalassemia B. G6PD deficiency C. ABO incompatibility D. Breastfeeding jaundice E. Breast milk jaundice",
  opts:["Thalassemia","G6PD deficiency","ABO incompatibility","Breastfeeding jaundice","Breast milk jaundice"],
  ans:2, key:"C ABO incompatibility"+KS,
  interp:"unconjugated hyperbilirubinemia (DB 1 จาก MB 18) อายุ 2 วัน + <b>แม่ O ลูก A</b> + <b>DAT weakly positive</b> + polychromasia (reticulocyte ↑ = ไขกระดูกสร้างทดแทน) = immune hemolysis จาก ABO · แม่ Rh+ ตัด Rh isoimmunization",
  why:"แม่ group O มี <b>anti-A/anti-B ชนิด IgG</b> ตามธรรมชาติ (ไม่ต้องเคยตั้งครรภ์มาก่อน — จึงเกิดได้ตั้งแต่ท้องแรก) ผ่านรกได้ → จับเม็ดเลือดแดงลูก group A หรือ B → extravascular hemolysis ที่ม้าม → <b>microspherocytes + polychromasia</b> และ unconjugated bilirubin สูง · ABO มักรุนแรงน้อยกว่า Rh: <b>DAT มักบวกอ่อน ๆ</b> (A/B antigen บนเม็ดเลือดทารกยังน้อย และ antigen กระจายในเนื้อเยื่ออื่นด้วย) และ Hb/CBC มักยังปกติ แต่ bilirubin ขึ้นได้สูงจนต้องฉายแสง · ผู้จดเขียน \"KEY ★\" ที่ DAT weakly positive = จุดที่บอกคำตอบ · แม่ Rh+ จึงไม่ใช่ Rh disease",
  wrong:["Thalassemia: β-thal ยังไม่แสดงในทารกแรกเกิดเพราะยังใช้ HbF (α2γ2) · α-thal ที่ทำให้ซีด/เหลืองตั้งแต่แรกเกิดต้องเป็นชนิดรุนแรง (Hb H disease บางชนิด หรือ Hb Bart's hydrops fetalis ที่บวมน้ำทั้งตัว) ซึ่ง CBC ต้องผิดปกติชัด (microcytic hypochromic) · และ thalassemia เป็น non-immune → DAT ต้องลบ","G6PD deficiency: hemolysis แบบ <b>DAT ลบ</b> (non-immune) พบบ่อยในทารกชายไทย (X-linked) เหลืองช่วง 24–48 ชม. หรือหลังสัมผัส oxidant (ลูกเหม็น ยาบางชนิด) · PBS อาจเห็น bite/blister cells · ผู้จดเขียนว่า <b>คิดเมื่อ Coombs negative</b> — ข้อนี้ DAT บวก จึงไม่ใช่","Breastfeeding jaundice (suboptimal intake jaundice) เกิดจากกินนมไม่พอ น้ำหนักลดมาก (&gt;8–10%) ถ่ายน้อย → enterohepatic circulation ↑ มักเริ่ม <b>day 3–5</b> · ไม่มี hemolysis: DAT ลบ ไม่มี polychromasia/reticulocytosis","Breast milk jaundice เริ่ม <b>&gt;day 5</b> (สูงสุดสัปดาห์ที่ 2 อยู่ได้ถึง 2–3 เดือน) ในทารกกินนมแม่ล้วน น้ำหนักขึ้นดี เกิดจากสารในน้ำนม (β-glucuronidase) · ไม่มี hemolysis และไม่ใช่อายุ 2 วัน"],
  trap:"\"CBC normal\" ไม่ได้ตัด hemolysis — ABO hemolysis มัก mild Hb ยังปกติ ให้ดู <b>DAT + blood group แม่ลูก + polychromasia/spherocyte</b> · \"mild jaundice\" แต่ MB 18 ไม่ mild · แม่ Rh+ ล่อให้คิดว่าไม่มี isoimmunization",
  summary:["Immune hemolysis = <b>DAT (direct Coombs) บวก</b>: ABO (แม่ O ลูก A หรือ B; เกิดได้ตั้งแต่ท้องแรกเพราะแม่มี IgG anti-A/B อยู่แล้ว; รุนแรงน้อย) · Rh (แม่ Rh− ลูก Rh+; แม่ต้องเคย sensitized → มักท้องหลัง; รุนแรงกว่า อาจ hydrops; ป้องกันด้วย anti-D) · minor blood group (Kell, c, E)","Non-immune hemolysis = DAT ลบ: G6PD deficiency, hereditary spherocytosis (spherocyte + polychromasia, osmotic fragility/EMA test), pyruvate kinase deficiency, sepsis","ABO hemolysis: DAT มักบวกอ่อน, <b>microspherocytes + polychromasia</b>, reticulocyte ↑, เหลืองใน 24–48 ชม.แรก, Hb มักปกติหรือลดเล็กน้อย · รักษาตามเกณฑ์ AAP 2022 (isoimmune = neurotoxicity risk factor), IVIG เมื่อใกล้เกณฑ์ exchange","ตามเวลาเริ่มเหลือง: &lt;24 ชม. hemolysis · 24–48 ชม. G6PD, sepsis · day 3–5 breastfeeding jaundice (น้ำหนักลดมาก) · &gt;day 5 breast milk jaundice (นมแม่ล้วน น้ำหนักขึ้นปกติ) · &gt;2 wk congenital hypothyroid, biliary atresia (conjugated, acholic stool)","Work-up ทารกเหลืองเร็ว: TSB/DB, blood group + Rh แม่ลูก, DAT, CBC + reticulocyte + PBS, G6PD (ทารกชาย/ครอบครัวมีประวัติ), albumin"],
  notes:"ลายมือบนโจทย์: \"2 days old\" เขียน <b>24–48 hr</b> ลากเส้นไป <b>ABO</b> · ไฮไลต์ \"mother blood group is O, Rh+\" และ \"boy's blood group is A\" · ขีดเส้นใต้แถว lab · วง MB 18 → <b>เหลืองมาก</b> · ไฮไลต์ \"direct antiglobulin test weakly positive\" + เขียนตัวใหญ่ <b>KEY ★</b> · ไฮไลต์ polychromasia → <b>+ microspherocyte</b> · A Thalassemia → <b>ต้องเหลืองจาก α-thalassemia แบบรุนแรง</b> · B G6PD → <b>if coomb neg ถึงคิด</b> · D → <b>♀ ตัวไม่ได้กินนม น้ำหนัก day 3–5</b> · E → <b>&gt;day 5 ↑</b> · วงช้อย C<br>สไลด์หน้า 2 (Cause of hyperbilirubinemia – onset): กรอบแดง first 24 h \"Immune hemolysis: ABO, Rh, minor blood group incompatibility (DCT positive)\" · ABO เขียน <b>normal ได้ ⊕</b> · <b>spherocyte + polychromasia</b> · non-immune G6PD/HS → <b>DCT neg.</b> · กรอบ BF jaundice (excessive weight loss) และ BM jaundice (exclusive breast feeding + normal weight gain)",
  kimg:KI("04c","02"), guide:G22+" · "+NEL+" (Hemolytic disease of the fetus and newborn)",
  mnemonic:"\"<b>Coombs บวก = ภูมิแม่</b> (ABO/Rh) · Coombs ลบ = เม็ดเลือดพังเอง (G6PD/HS)\" · ABO = แม่ O ลูก A/B ท้องแรกก็เป็นได้",
  opinion:"เห็นด้วยกับผู้จด (C) มั่นใจสูง — แม่ O ลูก A + DAT บวกอ่อน + polychromasia เป็นภาพคลาสสิกของ ABO hemolytic disease และเป็นช้อยเดียวที่เป็น immune hemolysis · ถ้าโจทย์เปลี่ยนเป็น DAT ลบในทารกชาย จะตอบ G6PD deficiency (B) แทน",
  variants:["แม่ Rh− ลูก Rh+ ท้องที่สอง ไม่เคยได้ anti-D + ซีดมาก/hydrops + DAT บวกแรง → Rh isoimmunization","ทารกชาย DAT ลบ เหลืองวันที่ 2 หลังแม่ใช้ลูกเหม็น PBS bite cells → G6PD deficiency","ทารกกินนมแม่ล้วน อายุ 10 วัน น้ำหนักขึ้นดี indirect bilirubin สูง ตรวจอื่นปกติ → breast milk jaundice (ให้นมแม่ต่อได้)"]}),
A({page:5, orig:"14",
  stem:"A newborn is delivered from a mother at 32 weeks of gestation with no antenatal care and prolonged rupture of membranes for 24 hours. The mother received inadequate intrapartum antibiotics. On physical examination, the body temperature is 36.5 °C and the infant appears well. Besides CBC, which additional investigation should be sent?",
  gray:"14. A newborn is delivered from GA 32-week mother with no ANC and 24 hours PROM who received inadequate ATB. Physical examination: BT 36.5 °C ที่เหลือสบายดี ถามว่านอกเหนือจาก CBC ควรส่ง investigation อะไรเพิ่ม — A. CRP B. Hemoculture C. Hemoculture, urine culture D. Hemoculture, CRP E. Hemoculture, urine culture, lumbar puncture",
  opts:["CRP","Hemoculture","Hemoculture and urine culture","Hemoculture and CRP","Hemoculture, urine culture, and lumbar puncture"],
  ans:1, key:"B Hemoculture"+KS,
  interp:"preterm 32 wk + PROM 24 ชม. (&gt;18 ชม.) + intrapartum antibiotic ไม่พอ + ไม่ฝากครรภ์ = เสี่ยง <b>early-onset sepsis</b> (&lt;72 ชม.) แต่ทารกดูดี · ถามว่านอกจาก CBC ส่งอะไรเพิ่ม",
  why:"ทารกที่เสี่ยง <b>early-onset sepsis</b> work-up ตามสไลด์คือ <b>CBC + blood culture</b> (± serial CRP, CXR เมื่อมีอาการทางหายใจ, ± LP) → สิ่งที่ต้องส่งเพิ่มจาก CBC คือ <b>hemoculture</b> ซึ่งเป็น gold standard ของการวินิจฉัย bacteremia · <b>LP ทำเมื่อ hemoculture บวก หรือสงสัย meningitis</b> (ชัก ซึม ไม่ตอบสนองต่อยา) — ทารกนี้ดูดี · <b>urine culture ไม่ช่วยใน EOS</b> เพราะเชื้อมาทาง vertical (ascending จาก GI/GU แม่ หรือ aspirate น้ำคร่ำ) ไม่ใช่ UTI — urine culture ใช้ใน late-onset sepsis · ในทางปฏิบัติ (AAP 2018 สำหรับ ≤34 6/7 wk) preterm ที่คลอดจาก PROM/สงสัยติดเชื้อ ส่ง blood culture แล้วเริ่ม <b>ampicillin + gentamicin</b> ได้เลย แล้วหยุดยาเมื่อ culture ลบที่ 36–48 ชม.",
  wrong:["CRP เดี่ยว ๆ วินิจฉัยหรือตัด sepsis ไม่ได้ (sensitivity ค่าเดียวต่ำ ขึ้นช้า 6–12 ชม. และขึ้นได้จาก PROM/การคลอดเอง) ต้องมี culture เสมอ — ใช้ <b>serial</b> CRP ช่วยตัดสินหยุดยาเท่านั้น","Urine culture ใช้ใน <b>late-onset</b> sepsis (&gt;72 ชม.) ที่ UTI เป็นแหล่งติดเชื้อได้ · ใน EOS อัตราพบ UTI ต่ำมาก การเก็บปัสสาวะ (suprapubic/catheter) ในทารกอายุไม่กี่ชั่วโมงไม่คุ้ม — ผู้จดเขียนข้างช้อยนี้ว่า <b>late</b>","CRP ถ้าจะใช้ต้องทำ <b>serial</b> (ผู้จดเขียน 6, 12, 24 hr) ไม่ใช่ค่าเดียวตอนแรก และไม่ใช่สิ่งที่ต้องส่ง — ข้อสอบถามสิ่งที่จำเป็น (blood culture) · ถ้าโจทย์ถาม \"การตรวจที่ช่วยตัดสินหยุดยาที่ 48 ชม.\" อาจตอบ serial CRP","Hemoculture + urine culture + LP เป็น work-up ครบชุดของ <b>late-onset sepsis</b> หรือ EOS ที่ hemoculture บวก/สงสัย meningitis (ชัก ซึม ไม่ตอบสนองต่อยา) — ทารกนี้ดูดี BT ปกติ ไม่มีข้อบ่งชี้ LP ตอนนี้"],
  trap:"ช้อยยาว ๆ ที่ \"ส่งครบทุกอย่าง\" (E) ไม่ใช่คำตอบเสมอ — ต้องแยก <b>early vs late onset</b> ก่อน · และ \"ดูดี\" ไม่ได้แปลว่าไม่ต้อง work-up เมื่อมี risk factor หลายข้อ (preterm + PROM &gt;18 ชม. + IAP ไม่พอ)",
  summary:["<b>Early-onset sepsis</b> (&lt;72 ชม. / &lt;6 วัน): vertical-ascending จาก GI/GU แม่ · GBS, Listeria monocytogenes, gram-negative enteric (E. coli) · Ix: CBC, <b>hemoculture</b> ± serial CRP (6, 12, 24 ชม.), CXR ถ้ามีอาการทางหายใจ, ± LP · ยา <b>ampicillin + gentamicin</b>","<b>Late-onset sepsis</b> (&gt;72 ชม. / &gt;6 วัน): horizontal (nosocomial/สิ่งแวดล้อม) · CoNS, S. aureus, GBS, E. coli, herpes · Ix: CBC, hemoculture, <b>urine culture, LP</b>, CXR ถ้ามีอาการ · ยา cefotaxime + ampicillin (สงสัย Listeria), cefotaxime + amikacin, vancomycin + aminoglycoside (อยู่ รพ.นาน/มี catheter)","Risk factors (สไลด์): maternal fever, PROM &gt;18 ชม., chorioamnionitis (Triple I = intrauterine inflammation or infection), maternal GBS colonization, maternal UTI, preterm labour","อาการ: respiratory distress, apnea, temperature instability, lethargy, septic shock (tachycardia, BP drop) — อาการไม่จำเพาะ ต้องคิดถึง sepsis ในทารกที่ไม่สบายทุกคน","<b>LP ใน EOS</b> (สไลด์): positive hemoculture (มี meningitis ร่วม ~30%), clinical suspected meningitis (seizures, lethargy), infants do not respond to appropriate antibiotic treatment","ป้องกัน: intrapartum antibiotic prophylaxis (penicillin/ampicillin ≥4 ชม. ก่อนคลอด) ในแม่ GBS บวก, GBS bacteriuria, เคยมีลูกเป็น GBS disease, ไม่ทราบผล GBS + preterm/PROM ≥18 ชม./ไข้"],
  notes:"ลายมือบนโจทย์: GA 32 → <b>preterm</b> · 24 hours PROM → <b>&gt;18 hr</b> · หัวโจทย์ <b>สงสัย sepsis !</b> · ไฮไลต์ \"received inadequate ATB\" และ \"ถามว่านอกเหนือจาก CBC ควรส่ง investigation อะไรเพิ่ม\" · วงช้อย B ✓ · ช้อย C และ E เขียน <b>late</b> · D: ใต้ CRP เขียน <b>ต้อง serial</b><br>สไลด์หน้า 5 (ตาราง EOS/LOS): EOS Ix \"CBC, blood culture, ± serial CRP\" ดอกจัน + เขียน <b>6, 12, 24 hr</b> · \"± LP\" → <b>if sepsis</b> · LOS: Urine culture, LP · Cefotaxime + ampicillin → <b>if กลัว listeria</b> · Vancomycin + aminoglycoside → <b>if เด็กอยู่ รพ.นาน / มีสาย catheter</b> · หน้า LP: positive hemoculture → <b>menin 30%</b> · clinical suspected meningitis → <b>hemo ⊖ but</b> · seizures <b>ชัก</b> · lethargy <b>ซึม</b> · ไม่ตอบสนองต่อยา <b>ให้ยาแล้วไม่ดีขึ้น</b><br>สไลด์หน้า 4 (risk factors): หัวสไลด์ <b>early &lt;72 hr or &lt;6 day / late</b> · PROM &gt;18 h <b>premature rupture of membrane</b> · chorioamnionitis <b>ติดเชื้อถุงน้ำคร่ำ</b> · septic shock <b>tachycardia, BP drop</b>",
  kimg:KI("05c","05a","05b","04d"), guide:"AAP Clinical Report: Management of Neonates Born at ≤34 6/7 Weeks' Gestation With Suspected or Proven Early-Onset Bacterial Sepsis (Pediatrics 2018;142:e20182896) · "+NEL+" (Neonatal sepsis)",
  mnemonic:"\"<b>Early ส่งน้อย · Late ส่งครบ</b>\" — EOS: CBC + H/C (± LP ถ้า H/C บวก) · LOS: H/C + U/C + LP",
  opinion:"เห็นด้วยกับผู้จด (B) มั่นใจปานกลาง–สูง — hemoculture เป็นสิ่งเดียวที่ขาดไม่ได้ใน EOS work-up · บางสถาบันส่ง CRP ร่วม (D) แต่ CRP ค่าเดียวไม่ช่วยตัดสินเริ่มยาและสไลด์ระบุ \"± serial CRP\" (ไม่บังคับ) ผู้จดจึงไม่เลือก · ถ้าโจทย์ให้ทารกมีอาการซึม/ชัก หรือบอกว่า hemoculture ขึ้นเชื้อ คำตอบจะเป็น E (เพิ่ม LP)",
  variants:["อายุ 10 วันใน NICU มี central line + ไข้ + feeding intolerance → late-onset sepsis: CBC, H/C, urine culture, LP + vancomycin + aminoglycoside","hemoculture ขึ้น GBS ในทารกอายุ 1 วัน → ต้องทำ LP (meningitis ร่วม ~30%)","ถามยา empirical ของ early-onset sepsis → ampicillin + gentamicin (ครอบคลุม GBS, Listeria, E. coli)"]}),
A({page:6, orig:"ไม่มีเลข (หน้า 6 สไลด์ 2)",
  stem:"A newborn is delivered by vacuum extraction with a birth weight of 4,000 g. Afterwards, he develops dyspnea, and an actively enlarging swelling mass at the left parietal area is noted. Blood pressure is 55/34 mmHg with a mean arterial pressure of 44 mmHg. What is the next proper investigation?",
  gray:"A newborn is delivered with vacuum extraction. Their birthweight is 4,000 g. Afterwards, he develops dyspnea and active swelling mass at left parietal area is noted. Blood pressure is 55/34 mmHg, mean arterial pressure is 44 mmHg. What is the next proper investigation? — A. Blood sugar B. Serial hematocrit C. Film skull D. Ultrasound brain E. Capillary blood gas",
  opts:["Blood sugar","Serial hematocrit","Skull radiograph","Ultrasound of the brain","Capillary blood gas"],
  ans:1, key:NK+" — ผู้จดเขียน \"may be\" ไว้ทั้งช้อย A และ B ไม่ได้วงคำตอบ",
  flag:"⚠ ไม่มีคีย์ชัด: ผู้จดเขียน may be ที่ A (ทำ POCT glucose ก่อน) และ B — เลือก B ตามประเด็นหลักของสไลด์ (subgaleal hemorrhage → hypovolemic shock); ถ้าโจทย์ถาม \"bedside test แรก\" ในเด็กตัวโต 4 kg ที่ซึม/ชัก จะตอบ A",
  interp:"vacuum extraction + <b>ก้อนบวมที่โตขึ้นเรื่อย ๆ</b> หลังคลอด = <b>subgaleal hemorrhage</b> (เลือดออกใต้ galea ข้าม suture ได้ เสียเลือดได้มาก) · SBP 55 ต่ำกว่าที่ควรของเด็ก 4 kg (≈70) → เริ่มมี hypovolemia",
  why:"ช่องใต้ galea aponeurosis ไม่มีขอบเขตกั้น (ยาวจาก orbital ridge ถึง nape และข้าม suture) จุเลือดได้ถึง 40–80% ของ blood volume ทารก → <b>hypovolemic shock ★★</b> เป็นภาวะแทรกซ้อนสำคัญที่สไลด์เน้น (\"ออกบ่อย\") · การตรวจที่ตอบปัญหาหลักคือ <b>serial hematocrit</b> (ร่วมกับ serial vital signs/BP, perfusion, วัดรอบศีรษะ) เพื่อจับการเสียเลือดต่อเนื่องและตัดสินให้เลือด — Hct แรกอาจยังปกติเพราะยังไม่มี hemodilution ต้องดูแนวโน้ม · ประเมิน BP ทารก: SBP ≈ <b>น้ำหนัก (kg) × 10 + 30</b> → 4 kg ควร ≈ 70 mmHg (ลายมือ \"∴ คนนี้ SBP ควรประมาณ 70\") · SBP 55 จึงต่ำ แม้ MAP 44 จะยัง ≥ GA (term) · ควรตรวจ coagulation (PT/aPTT, platelet) ร่วมด้วยเพราะ coagulopathy ทำให้เลือดออกต่อ",
  wrong:["Blood sugar: ทารกตัวโต 4,000 g (LGA) เสี่ยง hypoglycemia และทารกที่ไม่สบายทุกคนควรเจาะ POCT glucose — ผู้จดเขียน \"may be → ทำ POCT glucose ก่อน\" · แต่ไม่ใช่การตรวจที่ตอบปัญหาหลักของโจทย์ (ก้อนเลือดที่โตขึ้น + BP ต่ำ) ถ้าโจทย์ให้อาการ jittery/ชัก/ซึม หรือถามสิ่งแรกที่ทำข้างเตียง จะตอบช้อยนี้","Skull radiograph ใช้หา skull fracture (linear/depressed) เท่านั้น ไม่บอกปริมาณเลือดที่เสียและไม่เปลี่ยนการรักษาเร่งด่วนของ subgaleal · ผู้จดกากบาท","Ultrasound brain (ผ่าน anterior fontanelle) ดู IVH/parenchymal hemorrhage ในสมอง — ไม่เห็นช่องใต้ galea ที่อยู่นอกกะโหลก และไม่บอกปริมาณเลือดที่เสีย · ถ้าสงสัย intracranial hemorrhage ร่วม (ชัก ซึม) ใช้ CT/MRI · ผู้จดกากบาท","Capillary blood gas ช่วยดู metabolic acidosis จาก poor perfusion ได้บ้าง แต่ไม่ใช่การตรวจหลักของ subgaleal hemorrhage และไม่ติดตามการเสียเลือด · ผู้จดกากบาท"],
  trap:"\"left parietal\" ชวนให้นึกถึง cephalohematoma (ไม่ข้าม suture ไม่ทำให้ช็อก) — คำว่า <b>active swelling + vacuum + BP ต่ำ</b> ชี้ subgaleal · และ \"dyspnea\" ล่อไป blood gas/CXR · MAP 44 ดูปกติ แต่ SBP 55 ต่ำสำหรับเด็ก 4 kg",
  summary:["<b>Caput succedaneum</b>: soft tissue swelling เหนือ periosteum <b>ข้าม suture</b> มีตั้งแต่เกิด หายในไม่กี่วันแรก ไม่มีภาวะแทรกซ้อน","<b>Subgaleal hemorrhage</b>: ใต้ galea aponeurosis, fluctuant → tense scalp swelling, <b>ข้าม suture</b> (ทั้งศีรษะ ข้าม midline ได้), เกิดหลังคลอดไม่นาน (มักหลัง vacuum), หายใน ~1 สัปดาห์ (2–3 wk) · ภาวะแทรกซ้อน <b>hypovolemic shock ★★</b>, jaundice, coagulopathy · ออกสอบบ่อย","<b>Cephalohematoma</b>: ใต้ periosteum, tense, <b>ไม่ข้าม suture</b>, เกิดใน 24 ชม.แรก, หายหลายสัปดาห์ (2–6 wk) · ภาวะแทรกซ้อน jaundice, calcified cephalohematoma (uncommon), อาจมี linear skull fracture","BP ทารก (สไลด์): SBP ≈ 40 (1 kg) · 50 (2 kg) · 60 (3 kg) · <b>MAP ≥ GA</b> (เช่น GA 39 wk keep MAP &gt;39) · vital signs: BT 36.5–37.5 °C, RR 40–60, PR 100–160, SpO2 term &gt;95% (preterm &gt;90% OK)","ติดตาม subgaleal: serial Hct, vital signs/BP, perfusion (cap refill &lt;2 วินาที), รอบศีรษะ (เพิ่ม 1 cm ≈ เสียเลือด ~40 mL), bilirubin, coagulation · ช็อก → NSS 10 mL/kg IV แล้วให้ PRBC/FFP ตามภาวะ"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"vacuum extraction\" ★ · ไฮไลต์ \"4,000 g\" ★ เขียน <b>ตัวใหญ่</b> · ไฮไลต์ dyspnea และ \"active swelling mass at left parietal area\" · เหนือ BP เขียน <b># 1 ดู BP ก่อน</b> · วง 55 ลูกศร → <b>ต่ำกว่าปกติ</b> · วง MAP 44 เขียน <b>Term ปกติ</b> · A <b>may be</b> → <b>ทำ POCT glucose ก่อน</b> · B <b>may be</b> ± <b>เห็นบ่อยมาก</b> / <b>ไม่ serial vital sign BP ดีกว่า</b> · C, D, E กากบาท ✗ · กล่องฟ้า <b>SBP 40 = 1 kg · 50 = 2 kg · 60 = 3 kg</b> · กล่อง <b>MAP keep &gt;GA</b> · ใต้กล่อง <b>∴ คนนี้ SBP ควรประมาณ 70</b> · ตัวใหญ่ใต้สไลด์ <b>ออก!</b><br>สไลด์หน้า 6 (ตาราง scalp injury): กรอบแดง subgaleal \"Hypovolumic shock ★★\" + เขียน <b>ออกบ่อย</b> · cephalohematoma วง \"Jaundice\" → <b>เหลือง</b> · หายใน <b>2–6 wk หาย</b> · หน้า 5 (scalp injury รูป): caput <b>ข้าม suture ได้</b> · subgaleal <b>อยู่ใต้ galea</b> <b>ข้าม suture</b> · cephalohematoma <b>อยู่ใต้ periosteum</b> <b>ไม่ข้าม suture</b>",
  kimg:KI("06b","06a","05d","16d"), guide:NEL+" (Birth injury: extracranial hemorrhage) · AAP/AHA NRP 8th ed. (volume expansion) · สไลด์ติว NL2 จุฬาฯ",
  mnemonic:"\"<b>Sub-Galeal = Gallon of blood</b> → ช็อก (ข้าม suture)\" · Cephalo = ใต้ periosteum ไม่ข้าม · SBP ทารก ≈ kg × 10 + 30",
  opinion:"⚠ ไม่มีคีย์ — เลือก B มั่นใจปานกลาง · ผู้จดลังเลระหว่าง A (POCT glucose ในทารกตัวโต) กับ B (serial Hct) และเขียนว่า serial vital signs/BP อาจดีกว่า · เราเลือก B เพราะโจทย์ชี้ subgaleal hemorrhage ที่เริ่มเสียเลือด (ก้อนโตขึ้น + SBP ต่ำ) ซึ่งเป็นประเด็นที่สไลด์เน้นว่าออกบ่อย · ถ้าโจทย์ให้อาการ hypoglycemia (jittery, ชัก) หรือถาม \"bedside test แรก\" คำตอบจะเป็น A",
  variants:["ก้อนนิ่มข้าม midline + PR 190 + BP 40/30 + pallor → NSS 10 mL/kg IV push (hypovolemic shock จาก subgaleal)","ก้อนแข็งตึงขอบเขตไม่ข้าม suture เกิดในวันแรก เหลืองวันที่ 4 vital signs ปกติ → cephalohematoma: observe + ติดตาม bilirubin","บวมนิ่มข้าม suture ตั้งแต่เกิด หายใน 2 วัน → caput succedaneum ไม่ต้องรักษา"]}),
A({page:6, orig:"12",
  stem:"A term neonate delivered by vacuum extraction develops dyspnea at 1 hour after birth. Antenatal care history is normal. Physical examination: BT 37 °C, PR 190/min, BP 40/30 mmHg, RR 65/min, SpO2 95% (room air), weak pulse, regular rhythm, pallor, normal S1S2, no murmur, mild dyspnea, and a large bluish mass with fluctuation across the midline of the scalp. What is the most appropriate initial management?",
  gray:"12. Term neonate delivered by vacuum extraction developed dyspnea at 1 h after birth. Normal ANC history. Physical examination: BT 37 °C, PR 190/min, BP 40/30 mmHg, RR 65/min, SpO2 95% (room air), weak pulse, regular rhythm, pallor, normal S1S2, no murmur, mild dyspnea, large bluish mass with fluctuation across midline at scalp. What is the most appropriate initial management? — A. PPV B. U/S head C. Dopamine D. 10% D/W 65 mL/kg/day E. NSS 10 mL/kg IV push in 15 min",
  opts:["Positive pressure ventilation","Ultrasound of the head","Dopamine infusion","10% D/W 65 mL/kg/day","NSS 10 mL/kg IV push in 15 min"],
  ans:4, key:"E NSS 10 mL/kg IV push in 15 min"+KS,
  interp:"vacuum + ก้อนฟ่อง fluctuant สีคล้ำ <b>ข้าม midline</b> = subgaleal hemorrhage · PR 190, BP 40/30 (ทารก term ≈3 kg ควร SBP ≈60), weak pulse, pallor = <b>hypovolemic shock</b> · หายใจยังพอ (SpO2 95%) dyspnea น่าจะเป็นจาก shock/acidosis",
  why:"ทารกอยู่ในภาวะ <b>hypovolemic shock จาก subgaleal hemorrhage</b>: tachycardia (PR 190 เกิน 160), SBP 40 (ค่านี้เป็นของทารก 1 kg — ทารก term ≈3 kg ควร ≈60), weak pulse, pallor · หลัก C ของการกู้ชีพ: <b>volume expansion ทันที ด้วย NSS 10 mL/kg IV push ใน 5–10 (–15) นาที</b> ประเมินซ้ำ (HR, BP, cap refill) ให้ซ้ำได้ แล้วตามด้วย <b>PRBC/whole blood</b> (เสียเลือด ต้องให้เลือด) และแก้ coagulopathy (FFP, vitamin K) · ติดตาม serial Hct, รอบศีรษะ, bilirubin · การหายใจยังพอ (SpO2 95%, ไม่ apnea, HR ไม่ต่ำ) จึงไม่ต้อง PPV · dyspnea/RR 65 อธิบายได้จาก metabolic acidosis จาก poor perfusion",
  wrong:["PPV ใช้เมื่อ <b>apnea/gasping หรือ HR &lt;100</b> (NRP) — ทารกนี้หายใจเองได้ SpO2 95% และ HR 190 (tachycardia ไม่ใช่ bradycardia) · ปัญหาคือ circulation ไม่ใช่ breathing ถ้าโจทย์ให้ HR 80 + หายใจเฮือก จะตอบ PPV","U/S head ไม่ควรมาก่อนการกู้ช็อก และ subgaleal hemorrhage วินิจฉัยทางคลินิก (ก้อน fluctuant ข้าม suture หลัง vacuum) · U/S ผ่าน fontanelle ดูเลือดในสมอง ไม่ใช่ใต้ galea — ทำได้ภายหลังเมื่อ stable ถ้าสงสัย intracranial bleed ร่วม","Dopamine (inotrope/vasopressor) ไม่ใช่ยาแรกใน hypovolemic shock — ต้องเติม volume ก่อน การให้ vasopressor ใน hypovolemia ทำให้ perfusion แย่ลง · ใช้เมื่อเติม volume พอแล้วยังช็อก (cardiogenic/septic/distributive)","10% D/W 65 mL/kg/day คือ maintenance fluid วันแรกของทารก term (60–80 mL/kg/day) ให้ glucose แต่ไม่ใช่ resuscitation fluid — ไม่เพิ่ม intravascular volume ทันและ dextrose ไม่อยู่ใน intravascular"],
  trap:"\"dyspnea\" หลอกให้ไปที่ airway/PPV — ปัญหาหลักคือ <b>circulation</b> (ช็อกจากเลือดออก) · BP 40/30 อาจดู \"ปกติ\" ถ้าจำแค่ตัวเลขของทารก 1 kg — ต้องเทียบน้ำหนัก (term ≈3 kg → SBP ≈60) · HR 190 ไม่ใช่ข้อบ่งชี้ PPV",
  summary:["Subgaleal hemorrhage: หลัง vacuum, ก้อนนิ่ม fluctuant ข้าม suture/midline, ขยายต่อเนื่อง (ใบหูถูกดันไปข้างหน้า, periorbital ecchymosis) → hypovolemic shock (tachycardia, BP ต่ำ, weak pulse, pallor, cap refill &gt;2 วินาที) + jaundice + coagulopathy","Mx ช็อก: <b>NSS 10 mL/kg IV push ใน 5–10 นาที</b> (ซ้ำได้) → PRBC/whole blood, ตรวจ coagulation (PT/aPTT, fibrinogen, platelet) แก้ด้วย FFP/vitamin K, serial Hct, ปรึกษา NICU","Vital signs ทารก (สไลด์): BT 36.5–37.5 °C · RR 40–60 (&gt;60 = respiratory distress, &lt;40 หายใจช้า, หยุดหายใจ &gt;20 วินาที = apnea) · PR 100–160 (&lt;100 → PPV; ร้องไห้ tachycardia ได้แต่ vital signs อื่นต้องดี; ถ้าช็อก → cap refill &gt;2 s, BP drop, perfusion ลด) · SBP ≈ 40/50/60 ที่ 1/2/3 kg · MAP ≥ GA · SpO2 term &gt;95%, preterm &gt;90% OK","Shock ในทารก: hypovolemic (เลือดออก subgaleal, fetomaternal hemorrhage, twin-twin) · septic · cardiogenic (ductal-dependent lesion, asphyxia) — ทุกชนิดเริ่มด้วย volume 10 mL/kg ยกเว้นสงสัย cardiogenic"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"Term\" ลากเส้นจาก \"Normal ANC\" → <b>∴ น่าจะ OK</b> · ไฮไลต์ \"vacuum extraction\" และ dyspnea · วงกรอบ \"PR 190/min\" ลูกศรออกซ้าย · ข้างบรรทัดเขียน <b>normal 40–60</b> · วง BP <b>40</b> เขียน <b>= 1 kg but</b> (คนนี้ term) · ไฮไลต์ RR 65, SpO2 95% · ไฮไลต์ชมพู weak pulse, pallor, mild dyspnea, \"large bluish mass with fluctuation across midline at scalp\" + เขียนตัวใหญ่สีชมพู <b>shock</b> · วง \"across midline\" → <b>subgaleal</b> · ตารางมุมขวา <b>SBP 40/50/60 = 1/2/3 kg</b> · ไฮไลต์ช้อย E<br>สไลด์หน้า 16 (Vital sign neonatal period): BT 36.5–<b>37.5</b> °C · RR &gt;60 = <b>respiratory distress</b>, RR &lt;40 = <b>หายใจช้า</b>, <b>หยุดหายใจเกิน &gt;20 วิ = apnea</b> · PR วง 160 → <b>if เด็กร้องไห้ tachycardia ได้ แต่ vital sign อื่นต้องดี · if shock → cap refill &gt;2, BP drop, perfusion</b> · PR &lt;100 → <b>เด็กแย่ = PPV</b> · SBP 3 kg → 60 · MAP = GA เช่น GA 39 wk keep MAP &gt;39",
  kimg:KI("06c","06a","16d"), guide:NRP+" (volume expansion 10 mL/kg) · "+NEL+" (Birth injury)",
  mnemonic:"\"<b>ช็อก = C ก่อน B</b>\" — หายใจได้ SpO2 ดี HR เร็ว = เติมน้ำ NSS 10 mL/kg · PPV เฉพาะ apnea หรือ HR &lt;100",
  opinion:"เห็นด้วยกับผู้จด (E) มั่นใจสูง — ภาพ subgaleal hemorrhage + hypovolemic shock ชัดเจน และ E เป็นช้อยเดียวที่เป็น volume resuscitation · ในทางปฏิบัติจะเตรียม PRBC และตรวจ coagulation ไปพร้อมกัน แต่สิ่งแรกที่ทำคือ NSS 10 mL/kg",
  variants:["ให้ NSS 2 ครั้งแล้วยัง tachycardia Hct ลดจาก 50 เป็น 32 → PRBC transfusion ± FFP","ทารกหลัง vacuum ก้อนไม่ข้าม suture vital signs ปกติ → cephalohematoma: observe + ติดตาม bilirubin","ทารก apnea HR 80 หลัง initial steps → PPV (ไม่ใช่ volume)"]}),
A({page:7, orig:"8",
  stem:"A 2,000-g term female infant is delivered with Apgar scores of 5 and 9. She has a history of fetal growth restriction. Physical examination: alert, BT 37 °C, HR 140 bpm, RR 40 bpm. Blood glucose is 35 mg/dL and hematocrit is 64%. What is the most appropriate nutrition for this patient?",
  gray:"8. A 2000 g term female infant is delivered with Apgar score of 5, 9. She has history of fetal growth restriction. PE: Alert BT 37oC HR 140 bpm RR 40 bpm. Glucose 35 mg/dL, Hct 64%. What is the most appropriate nutrition in this patient? — A. 10% DW 2ml/kg B. 10% DW 65mg/kg/day C. 10% DW 65mg/kg/day + 3% deficit D. Early feeding + dextrose E. Early feeding + infant formula",
  opts:["10% D/W 2 mL/kg IV","10% D/W 65 mL/kg/day IV","10% D/W 65 mL/kg/day IV plus 3% deficit","Early feeding plus oral dextrose","Early feeding plus infant formula"],
  ans:4, key:"E Early feeding + infant formula — ⚠ ผู้จดวงทั้ง A (✓✓) และ E (✓)",
  flag:"⚠ ผู้จดวงไว้ 2 ช้อย: A มี ✓✓ และ E มี ✓ พร้อมโน้ต \"ถ้ามีนมแม่ ให้นมแม่ก่อน\" — ตอบ E ตามสไลด์ Mx (asymptomatic hypoglycemia = early feeding) · ช้อย B/C ต้นฉบับพิมพ์หน่วย mg/kg/day (น่าจะหมายถึง mL/kg/day)",
  interp:"SGA (FGR) term 2,000 g = กลุ่มเสี่ยง hypoglycemia · glucose 35 mg/dL แต่ <b>alert ไม่มีอาการ</b> (vital signs ปกติ) = <b>asymptomatic</b> · Hct 64% ยังไม่ถึงเกณฑ์ polycythemia (≥65%) · Apgar 5 ที่ 1 นาทีดีขึ้นเป็น 9",
  why:"ทารก SGA ไม่มี glycogen/fat สำรองพอ และอาจ hyperinsulinism ชั่วคราว จึงเป็น <b>กลุ่มที่ต้องคัดกรอง</b> (preterm, IUGR/SGA, LBW, LGA, maternal diabetes) · glucose 35 mg/dL (≤40 = hypoglycemia ตามนิยามสไลด์) แต่ทารก <b>alert ไม่มีอาการ</b> (ไม่ jittery ไม่ซึม ไม่ชัก ไม่ apnea) → ตามสไลด์ <b>asymptomatic hypoglycemia = early feeding แล้ว F/U POCT glucose ใน 60 นาที</b> · นมที่ให้: นมแม่ก่อน ถ้าไม่มีหรือไม่พอใช้ <b>infant formula</b> (ลายมือ \"if มีนมแม่ ให้นมแม่ก่อน\") · ตาม AAP algorithm ช่วง 4–24 ชม. glucose 35–45 → refeed/IV glucose ตามความจำเป็น; ช่วง 0–4 ชม. 25–40 → refeed · ให้ <b>IV glucose</b> เมื่อ <b>มีอาการและ glucose &lt;40</b> หรือให้นมแล้วยังต่ำกว่าเกณฑ์ (&lt;25 ใน 4 ชม.แรก, &lt;35 หลัง 4 ชม.) · เป้าหมาย ≥45 mg/dL ก่อน routine feed",
  wrong:["10% D/W 2 mL/kg IV push (dextrose 200 mg/kg) ใช้กับ <b>symptomatic</b> hypoglycemia (สไลด์ ★★!) หรือ glucose ต่ำมาก (&lt;25 ใน 4 ชม.แรก) / ให้นมแล้วไม่ขึ้น แล้วตามด้วย IV fluid GIR 5–8 mg/kg/min — ทารกนี้ alert ไม่มีอาการ · ผู้จดวงช้อยนี้ ✓✓ ไว้ด้วย ถ้าโจทย์ให้อาการ jittery/ชัก/ซึม จะตอบช้อยนี้","10% D/W 65 mL/kg/day IV คือ maintenance IV fluid วันแรก (GIR ≈ 4.5 mg/kg/min) — ไม่ใช่การรักษาแรกในทารกที่ไม่มีอาการและกินได้ และถ้าจะให้ IV เพื่อแก้ hypoglycemia ต้องให้ GIR 5–8 (80–100 mL/kg/day) ตามด้วย bolus ถ้ามีอาการ · ผู้จดเขียน IV fluid ไม่ใช่ เพราะ glucose ต่ำอยู่แล้ว","\"+ 3% deficit\" ใช้ชดเชยการขาดน้ำ — ทารกนี้ไม่ได้ขาดน้ำ และเป็น IV ที่ไม่จำเป็นในทารก asymptomatic · ต้นฉบับพิมพ์หน่วย mg/kg/day ซึ่งไม่ถูก (ควรเป็น mL/kg/day)","oral dextrose (น้ำเกลือผสมน้ำตาล/glucose water) ไม่แนะนำ — ให้พลังงานน้อย glucose ขึ้นเร็วแล้วตก และแทนที่นม · ผู้จดกากบาทคำว่า dextrose · (มีแนวทางใช้ buccal 40% dextrose gel 0.5 mL/kg ร่วมกับให้นม แต่ไม่ใช่สิ่งที่สไลด์สอน)"],
  trap:"เห็น glucose 35 แล้วรีบ IV push — ต้องดูก่อนว่า <b>มีอาการหรือไม่</b> (สไลด์แยก symptomatic vs asymptomatic ชัด) · Hct 64% ล่อไป polycythemia (เกณฑ์ venous Hct ≥65%) · Apgar 5 ที่ 1 นาทีไม่ใช่อาการของ hypoglycemia",
  summary:["นิยาม (สไลด์): <b>POCT glucose ≤40 mg%</b> · คัดกรองกลุ่มเสี่ยง: preterm, IUGR/SGA, LBW, LGA, maternal diabetes · (ออกแน่ ★)","อาการ: sweating, tachypnea/cyanosis/apnea, hypotonia/poor feeding, seizure, lethargy/coma, frequent jitteriness (AAP: irritability, tremors, exaggerated Moro, high-pitched cry, floppiness)","<b>Symptomatic</b>: obtain blood sugar → <b>10% dextrose 2 mL/kg IV push</b> (200 mg/kg) → F/U POCT glucose 60 นาที → IV fluid GIR 5–8 mg/kg/min (≈80–100 mL/kg/day)","<b>Asymptomatic</b>: <b>early feeding</b> → F/U POCT glucose 60 นาที","AAP algorithm (late preterm 34–36 6/7 wk, term SGA, IDM, LGA): 0–4 ชม. initial feed ใน 1 ชม.แรก เจาะ 30 นาทีหลัง feed แรก — &lt;25 → feed แล้วเจาะซ้ำ 1 ชม. → ยัง &lt;25 IV glucose, 25–40 refeed/IV prn · 4–24 ชม. feed q2–3 ชม. เจาะก่อนทุก feed — &lt;35 → feed แล้วเจาะซ้ำ 1 ชม. → ยัง &lt;35 IV glucose, 35–45 refeed/IV prn · เป้า ≥45 mg/dL ก่อน routine feed · symptomatic และ &lt;40 → IV glucose ทันที","Emergency treatment: bolus dextrose 0.2 g/kg IV ใน 1 นาที (10% D 2 mL/kg) ต่อด้วย GIR 6–8 mg/kg/min · <b>GIR = %dextrose × rate (mL/h) ÷ (6 × BW)</b> · เจาะซ้ำทุก 10–20 นาทีหลังการรักษาจนปกติ","Polycythemia (สไลด์): venous Hct ≥65% (ปกติ 45–65%; capillary ค่าสูงกว่า venous) · risk: placental insufficiency, maternal diabetes, smoking, trisomy 13/18/21, Beckwith-Wiedemann, twin-to-twin, neonatal hyperthyroidism · symptomatic → partial exchange ด้วย NSS"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"A 2000 g\" เขียน <b>preterm? SGA</b> · เหนือโจทย์ <b>low Apgar score</b> · วง Apgar 5 → <b>low Apgar @1 min</b> · ไฮไลต์ \"Alert BT 37oC HR 140 bpm RR 40 bpm\" · วงกรอบ \"Glucose 35 mg/dL\" ลูกศร ↓ · Hct 64% เขียน <b>(45–65%)</b> · วงช้อย A พร้อม <b>✓✓</b> · ขีดเส้นใต้ \"mg/kg/day\" ใน B และ C · C, D มี \"?\" · วงเล็บ B–C เขียน <b>IV fluid ไม่ใช่ glucose ต่ำอยู่แล้ว</b> (ลูกศร <b>เพราะ</b>) · D กากบาทคำว่า dextrose · วงช้อย E ✓ → <b>if มีนมแม่ ให้นมแม่ก่อน</b><br>สไลด์หน้า 6–7: หัว Hypoglycemia ★ <b>ออกแน่</b> · definition วง <b>≤40 mg%</b> · ไฮไลต์กลุ่มเสี่ยง preterm, IUGR/SGA, LBW, LGA, maternal diabetes · symptomatic: obtain blood sugar ★★ · <b>10% dextrose 2 mL/kg iv push ★★!</b> · GIR 5–8 → <b>80–100 mL/kg/day</b> · asymptomatic: ไฮไลต์ <b>Early feeding</b> · AAP algorithm ไฮไลต์ initial feed within 1 hour, feed and check in 1 hour, &lt;25 → IV glucose, 25–40 → refeed/IV glucose, target ≥45 prior to routine feeds (<b>ต้องดู</b>) · polycythemia: venous Hct ≥65% <b>normal = 45–65%</b> · <b>≠ capillary → ค่าสูงกว่า Hct จริง</b>",
  kimg:KI("07c","06d","07a","07b"), guide:"AAP Clinical Report: Postnatal Glucose Homeostasis in Late-Preterm and Term Infants (Pediatrics 2011;127:575) · "+NEL+" (Hypoglycemia)",
  mnemonic:"\"<b>มีอาการ → D10 2 mL/kg · ไม่มีอาการ → ให้นม แล้วเจาะซ้ำ 1 ชม.</b>\" · นิยาม ≤40 · เป้า ≥45",
  opinion:"⚠ เลือก E มั่นใจปานกลาง — ผู้จดวงทั้ง A (✓✓) และ E (✓) · เราตอบ E เพราะทารก alert vital signs ปกติ = asymptomatic hypoglycemia ซึ่งทั้งสไลด์ (asymptomatic → early feeding) และ AAP (glucose 25–40 / 35–45 → refeed) ให้ให้นมก่อน · A จะถูกถ้าโจทย์ให้อาการ (jittery, ชัก, ซึม, apnea) หรือ glucose &lt;25 ในช่วง 4 ชม.แรก · ช้อย B/C ต้นฉบับพิมพ์หน่วยผิด (mg/kg/day) แปลเป็น mL/kg/day",
  variants:["เด็กเดียวกันแต่ jittery/ชัก glucose 30 mg/dL → 10% D/W 2 mL/kg IV push แล้วต่อ IV GIR 6–8 mg/kg/min","ให้นมแล้ว 1 ชม. glucose ยัง 20 mg/dL (อายุ 2 ชม.) → IV glucose","Hct 68% + lethargy/poor feeding → symptomatic polycythemia → partial exchange transfusion ด้วย NSS"]}),
A({page:13, orig:"10",
  stem:"A 2,200-g term infant develops respiratory distress within 1 hour after birth. Physical examination: T 37 °C, RR 60 bpm, HR 140 bpm, cyanosis, decreased breath sounds on the left lung, the heart sounds shifted to the right, and a scaphoid abdomen. What is the most proper management?",
  gray:"10. A 2200 g term infant develops respiratory distress within 1 hour after birth. PE: T 37oC RR 60 bpm HR 140 bpm, cyanosis, decreased breath sound on the left lung, the heart sound shift to the right, scaphoid abdomen. What is the most proper management? — A. Positive pressure ventilation B. Gastric tube insertion C. Endotracheal tube insertion D. Left thoracostomy E. Nasal high-flow oxygen",
  opts:["Positive pressure ventilation by bag and mask","Gastric tube insertion","Endotracheal tube insertion","Left thoracostomy","Nasal high-flow oxygen"],
  ans:2, key:"C Endotracheal tube insertion"+KS,
  interp:"หอบตั้งแต่แรกเกิด (ภายใน 1 ชม.) + cyanosis + เสียงหายใจซ้ายลด + heart sound ย้ายไปขวา + <b>scaphoid abdomen</b> = <b>congenital diaphragmatic hernia ด้านซ้าย</b> (Bochdalek) — ลำไส้ขึ้นไปอยู่ในช่องอกซ้าย ดัน mediastinum ไปขวา",
  why:"CDH ที่มี respiratory distress หลังเกิด → <b>intubate ทันที (Intubate ★★)</b> ร่วมกับ <b>OG tube decompression</b> (เอาลมในกระเพาะ/ลำไส้ออก) และ NPO · <b>ห้าม PPV ผ่าน mask</b>: ลมจาก bag-mask เข้ากระเพาะและลำไส้ที่อยู่ในช่องอก → ลำไส้โป่ง กดปอดข้างนั้นและดัน mediastinum มากขึ้น → hypoxemia แย่ลง · หลังใส่ท่อใช้ gentle ventilation (จำกัด peak pressure เพื่อป้องกัน pneumothorax ของปอดที่ hypoplastic), target preductal SpO2 85–95%, รักษา PPHN, แล้วผ่าตัดซ่อมเมื่อ stable (ไม่ใช่ emergency surgery) · การผ่าตัดไม่ได้แก้ pulmonary hypoplasia ซึ่งเป็นตัวกำหนดการรอดชีวิต",
  wrong:["<b>ห้าม PPV ผ่าน bag-mask</b> ใน CDH (สไลด์: Avoid PPV via mask → ลมเข้าลำไส้ในช่องอก) — ทำให้ลำไส้ในช่องอกโป่งและกดปอดมากขึ้น · ถ้าทารกไม่ใช่ CDH (เช่น apnea หลังคลอด HR &lt;100) PPV ถึงจะเป็นคำตอบ","OG/gastric tube <b>ต้องใส่จริง</b> (decompress ลำไส้ในช่องอก) และทำคู่กับการใส่ท่อช่วยหายใจ — แต่ทารกนี้ cyanosis จาก respiratory failure การจัดการหลักที่ต้องทำคือ secure airway ด้วย ET tube · ผู้จดใส่ \"?\" ที่ช้อยนี้","Left thoracostomy ผิดและอันตราย — ในช่องอกซ้ายคือลำไส้ (ไม่ใช่ลมจาก pneumothorax) การแทงท่ออาจทะลุลำไส้ · thoracostomy ใช้กับ tension pneumothorax ซึ่งท้องจะไม่แฟบ (scaphoid) และไม่มี bowel sound ในอก · แต่ pneumothorax เป็นภาวะแทรกซ้อนของ CDH ได้ภายหลัง","Nasal high-flow/CPAP ดันลมเข้าทางเดินอาหารเช่นกัน (เหมือน mask) ทำให้ลำไส้ในช่องอกโป่ง และไม่พอสำหรับ CDH ที่ cyanosis — ใช้กับ RDS/TTNB ที่หายใจเองได้"],
  trap:"หัวใจเลื่อนไปขวา + เสียงหายใจซ้ายลด ชวนคิด <b>tension pneumothorax</b> → แต่ <b>scaphoid abdomen</b> (ท้องแฟบเพราะลำไส้ขึ้นไปในอก) คือ keyword ของ CDH · และ \"ทารกหอบ = PPV\" ใช้ไม่ได้กับ CDH",
  summary:["CDH: <b>85% ด้านซ้าย</b> (Bochdalek, posterolateral), 15% ขวา · Morgagni (anterior) พบน้อย · มักวินิจฉัยได้จาก prenatal ultrasound","อาการ (สไลด์): respiratory distress ในไม่กี่นาทีแรก, retraction, cyanosis, <b>scaphoid abdomen</b> (KW), heart sound shift to the right (Lt-sided CDH), decreased breath sound หรือได้ยิน bowel sound ข้างที่เป็น","CXR: bowel loops/gastric bubble ในช่องอกซ้าย, mediastinal shift ไปขวา, ปลาย OG tube อยู่ในช่องอก","ภาวะแทรกซ้อน: <b>lung hypoplasia</b> (สาเหตุตายหลัก), <b>PPHN</b>, pneumothorax","Mx (สไลด์): <b>Avoid PPV via mask</b> · <b>Intubate</b> in infant with respiratory distress after birth · <b>OG decompress</b> · NPO · gentle ventilation, รักษา PPHN (iNO, ECMO ในรายรุนแรง) → ผ่าตัดเมื่อ stable","Respiratory distress DDx ในทารกแรกเกิด: RDS (preterm, ground-glass + air bronchogram), TTNB (C/S, fluid in fissure ดีขึ้นใน 24–72 ชม.), MAS (term/post-term, patchy + hyperinflation), infection (pneumonia/sepsis), CDH, TE fistula, choanal atresia"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"respiratory distress within 1 hour\" · RR 60 เขียน <b>40–60</b> · HR 140 เขียน <b>110–160</b> · ไฮไลต์ชมพู \"decreased breath sound on the left lung, the heart sound shift to the right, scaphoid abdomen\" → <b>= congenital diaphragmatic hernia</b> · A <b>?</b> · B <b>?</b> · วง/ขีดช้อย C<br>สไลด์หน้า 11 (CDH): เขียนตัวใหญ่ <b>★ ออก</b> · วง \"left side\" เขียน <b>พบบ่อย</b> · \"!!\" ที่ respiratory distress in the first few minute · กล่อง <b>KW !!</b> ที่ scaphoid abdomen → <b>อวัยวะในท้องแบน</b> <b>ลำไส้ → ช่องอก</b> · heart sound shift to the right → <b>เพราะ</b>ลำไส้ดัน · decrease breath sound → <b>เพราะมีลำไส้</b> · Management: <b>ห้าม!</b> Avoid PPV via mask ⇒ <b>ลมเข้าท้อง ลำไส้โป่ง</b> · <b>★★ Intubate</b> (วงชมพู) · OG decompress → <b>ใส่เพื่อเอาลมในลำไส้ออก</b> · CXR วาดหัวใจที่ถูกดันไปขวา + ลูกศร <b>ลำไส้</b> ในช่องอกซ้าย",
  kimg:KI("13a","11c","11d"), guide:NRP+" · CDH EURO Consortium Consensus 2015 update (Neonatology 2016) · "+NEL+" (Diaphragmatic hernia)",
  mnemonic:"\"<b>ท้องแฟบ อกมีลำไส้ = ห้าม bag · ใส่ tube + OG</b>\" (CDH: no mask, tube, tube)",
  opinion:"เห็นด้วยกับผู้จด (C) มั่นใจสูง — ในทางปฏิบัติทำ ET tube + OG tube พร้อมกัน ผู้จดจึงใส่ \"?\" ที่ B ไว้ · แต่ทารกนี้ cyanosis จาก respiratory distress สิ่งที่แก้ปัญหาที่คุกคามชีวิตคือ secure airway ด้วยท่อช่วยหายใจ และสไลด์ให้ Intubate ★★ · ถ้าโจทย์ถามว่า \"นอกจากใส่ท่อช่วยหายใจแล้ว ต้องทำอะไรต่อ\" จะตอบ B",
  variants:["ถาม CXR → bowel loops ในช่องอกซ้าย + mediastinal shift ไปขวา + ปลาย OG tube อยู่ในช่องอก","ถามภาวะแทรกซ้อนที่เป็นสาเหตุตายหลัก → pulmonary hypoplasia / PPHN","ทารก C/S หายใจเร็ว CXR fluid in fissure ดีขึ้นใน 48 ชม. → TTNB (supportive O2/CPAP)"]}),
A({page:14, orig:"2",
  stem:"A newborn with Apgar scores of 4 and 5 undergoes effective positive pressure ventilation with FiO2 0.4. The heart rate is 140/min, but the infant still has apnea, with SpO2 65% at 2 minutes. The maternal history is significant for pethidine use 2 hours before delivery. What is the next most proper management?",
  gray:"2. A newborn with Apgar score of 4, 5 undergoes effective PPV FiO2 0.4 HR 140/min but still has apnea with SpO2 65% at 2 minutes. Maternal history is significant for use of pethidine 2 hours before delivery. What is the next most proper management? — A. Give naloxone B. Increase FiO2 C. Give O2 flow by tubing D. Give CPAP E. Endotracheal intubation",
  opts:["Give naloxone","Increase FiO2","Give free-flow oxygen by tubing","Give CPAP","Endotracheal intubation"],
  ans:4, key:"E Endotracheal intubation"+KS,
  interp:"PPV ได้ผล (HR 140) แต่ <b>ยังไม่หายใจเอง</b> · SpO2 65% ที่ 2 นาที <b>อยู่ในเป้า</b> (65–70%) · แม่ได้ pethidine (opioid) ก่อนคลอด 2 ชม. → respiratory depression จากยา · ถามขั้นต่อไป",
  why:"ตาม NRP 2020 ทารกที่ <b>ยัง apnea</b> แม้ PPV ได้ผล (HR ขึ้นเป็น 140) ต้อง <b>ช่วยหายใจต่อ</b> — การ PPV ผ่าน mask นาน ๆ ไม่ได้ผลเต็มที่และลมเข้ากระเพาะ จึงพิจารณา <b>ใส่ endotracheal tube</b> (หรือ laryngeal mask) เพื่อให้ ventilation มีประสิทธิภาพและต่อเนื่อง · <b>naloxone ไม่แนะนำในการกู้ชีพเบื้องต้นในห้องคลอด</b> (ไม่มีหลักฐานว่าช่วย, เสี่ยง seizure/withdrawal ถ้าแม่ใช้ opioid เรื้อรัง และทำให้ช้าในการช่วยหายใจ) — หลักคือ <b>Airway and breathing are important in NCPR</b> · ผู้จดเขียนชัด: guideline 2010 → ให้ naloxone reverse ได้ · guideline 2020 → ใส่ tube · SpO2 65% ที่ 2 นาทีอยู่ในเป้า จึงไม่ต้องเพิ่ม FiO2 · อาการ opioid จะหมดเองเมื่อยาหมดฤทธิ์ ระหว่างนั้นช่วยหายใจไป",
  wrong:["Naloxone: guideline เก่า (2010) ให้ 0.1 mg/kg เพื่อ reverse opioid ในทารกที่แม่ได้ยาภายใน 4 ชม. · NRP ปัจจุบันไม่แนะนำในการกู้ชีพ (หลักคือ ventilation) และห้ามในแม่ที่ใช้ opioid เรื้อรัง (neonatal withdrawal seizure) — ผู้จดเขียนว่าเฉลยเปลี่ยนตาม guideline · ถ้าข้อสอบใช้ guideline 2010 จะตอบช้อยนี้","Increase FiO2 ไม่จำเป็น — SpO2 65% ที่ 2 นาที = ตามเป้า (1 นาที 60–65%, 2 นาที 65–70%, 3 นาที 70–75%) การให้ O2 เกินทำ oxidative injury · ปรับ FiO2 เมื่อ SpO2 ต่ำกว่าเป้าของนาทีนั้น","Free-flow O2 ทางสาย ใช้กับทารกที่ <b>หายใจเองได้</b>แต่ cyanosis/SpO2 ต่ำกว่าเป้า (term) — ทารกนี้ apnea O2 ไม่เข้าปอดถ้าไม่หายใจ","CPAP ต้องมีการหายใจเอง ใช้กับ labored breathing หรือ persistent cyanosis (โดยเฉพาะ preterm) — ไม่ใช้ใน apnea · ผู้จดเขียนในสไลด์ NCPR: oxygen → term ร้องดีแต่เขียว, CPAP → preterm"],
  trap:"ประวัติ pethidine ล่อให้ตอบ naloxone — <b>เฉลยเปลี่ยนตาม guideline</b> (2010 → 2020) · และ SpO2 65% ดูต่ำแต่ \"ตามเป้า\" ที่ 2 นาที อย่ารีบเพิ่ม O2",
  summary:["NRP (สไลด์): <b>A</b>irway – initial steps (warm, dry, stimulate, position airway โดยแหงนคอเล็กน้อย, suction if needed) ภายใน 1 นาทีแรก · <b>B</b>reathing – PPV, intubate · <b>C</b>irculation – chest compression · <b>D</b>rugs – adrenaline, NSS","<b>Apnea/gasping หรือ HR &lt;100 → PPV</b> (→ ET tube/laryngeal mask ถ้า PPV ไม่ได้ผลหรือต้องนาน) · labored breathing/persistent cyanosis → O2 (term ร้องดีแต่เขียว) / CPAP (preterm)","<b>HR &lt;60</b> หลัง PPV ที่ได้ผล 30 วินาที → intubate + chest compression 3:1 + O2 100% → HR ยัง &lt;60 → adrenaline IV 0.02 mg/kg (UVC) ทุก 3–5 นาที, NSS 10 mL/kg ถ้าสงสัย hypovolemia","Target preductal SpO2: 1 นาที 60–65% · 2 นาที 65–70% · 3 นาที 70–75% · 4 นาที 75–80% · 5 นาที 80–85% · 10 นาที 85–95%","O2 เริ่มต้นตอน PPV: ≥35 wk ใช้ 21% · &lt;35 wk ใช้ 21–30% · <b>Airway and breathing are important in NCPR</b> (สไลด์)","Naloxone: ไม่ใช่ส่วนของ NRP algorithm ปัจจุบัน — ช่วยหายใจจนกว่าทารกจะหายใจเองได้ ห้ามในแม่ใช้ opioid เรื้อรัง"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"Apgar score of 4, 5\", \"effective PPV FiO2 0.4 HR 140/min but still has\" · วงแดง <b>apnea</b> · ไฮไลต์ \"SpO2 65% at 2 minutes\" · ขีดใต้ \"pethidine 2 hours before delivery\" ลูกศรลง → <b>guideline 2010 → ให้ naloxone ได้ reverse</b> · <b>guideline 2020 → ใส่ tube</b> · ขีด/วงช้อย E · แปะ flow NCPR ข้างโจทย์ (Apnea or gasping or HR &lt;100 → PPV → ET tube กรอบแดง) ลูกศรฟ้าลงไป <b>ใส่ tube</b><br>สไลด์หน้า 13 (NCPR – Essential): Breathing \"Apnea or grasping or HR &lt;100/min\" → เขียน <b>HR &lt;100 or ไม่หายใจ or หายใจเฮือก</b> → PPV → ET tube · วง HR &lt;60 · กล่อง <b>HR &lt;100 PPV · HR &lt;60 CPR</b> · Oxygen → <b>term → ร้องดีแต่เขียว ให้ออกซิเจน</b> · CPAP → <b>preterm</b> · \"Airway and breathing are important in NCPR\" (ตัวแดง) · initial steps: warm, dry → <b>วางบนที่เตรียมไว้ ห่อผ้า เช็ดตัว</b> · NRP algorithm warm, dry, stimulate, position → <b>คอแหงน</b>",
  kimg:KI("14a","13b","13d"), guide:NRP,
  mnemonic:"\"<b>100 ให้ลม · 60 ให้กด</b>\" (HR &lt;100 PPV · HR &lt;60 CPR) · pethidine: 2010 = naloxone, <b>2020 = tube</b>",
  opinion:"เห็นด้วยกับผู้จด (E) มั่นใจปานกลาง–สูง — คำตอบขึ้นกับ guideline ที่ผู้ออกข้อสอบใช้: ข้อสอบเก่าที่อิง NRP 2010 อาจตอบ A (naloxone) แต่ผู้ติวระบุว่าตาม guideline 2020 ต้องตอบใส่ tube และ NRP 8th ed. ไม่มี naloxone ใน algorithm แล้ว · ช้อย B–D ผิดทุก guideline (SpO2 ตามเป้า, ทารก apnea)",
  variants:["HR 50 หลัง PPV ที่ได้ผล 30 วินาที → intubate + chest compression 3:1 + O2 100%","ทารกหายใจเองแต่ cyanosis SpO2 ต่ำกว่าเป้า (term) → free-flow O2 · preterm labored breathing → CPAP","HR &lt;60 แม้ compression 60 วินาที → adrenaline 0.02 mg/kg IV ทาง UVC"]}),
A({page:14, orig:"13",
  stem:"A term newborn was delivered by cesarean section due to fetal distress with meconium-stained amniotic fluid. Physical examination shows central cyanosis, a heart rate of 80/min, and poor tone. What is the most appropriate initial management?",
  gray:"13. A term newborn was delivered by C/S due to fetal distress with meconium-stained amniotic fluid. Physical examination: central cyanosis, HR 80/min, and poor tone. What is the most appropriate initial management? — A. 100% oxygen B. PPV C. Intubation with suction by meconium aspirator D. Provide warm and tactile stimulation",
  opts:["100% oxygen","Positive pressure ventilation","Intubation with suction by meconium aspirator","Provide warmth and tactile stimulation","Chest compressions"],
  ans:1, key:"B PPV"+KS,
  flag:"⚠ ต้นฉบับมี 4 ช้อย (A–D) — เติมช้อย E · ถ้าโจทย์หมายถึงวินาทีแรกหลังเกิดก่อนทำอะไรเลย ขั้นแรกตาม NRP คือ initial steps (D) — โจทย์บอก HR 80 แล้ว จึงถือว่าประเมินแล้ว → PPV",
  interp:"MSAF + ทารก <b>non-vigorous</b> (poor tone, central cyanosis) + <b>HR 80 (&lt;100)</b> → ต้องช่วยหายใจ · ถามว่าทำอะไร",
  why:"NRP (ตั้งแต่ 2015 ถึงปัจจุบัน 2020): ทารก non-vigorous ที่มี meconium <b>ไม่ต้อง intubate เพื่อดูด meconium เป็น routine</b> แล้ว เพราะไม่ลด MAS/การตาย และทำให้ PPV ช้า — ทำ initial steps (warm, dry, stimulate, position, clear airway ด้วย bulb ถ้าจำเป็น) แล้วถ้า <b>apnea/gasping หรือ HR &lt;100 → PPV ทันที</b> (ภายใน 60 วินาทีแรก — \"golden minute\") · ทารกนี้ HR 80 จึงเข้าเกณฑ์ PPV · ใส่ท่อดูดขี้เทาทำเฉพาะเมื่อ <b>airway อุดตัน</b> จน PPV ไม่ได้ผล (อกไม่ยก) · ผู้จดเขียน \"HR &lt;60 or ไม่หายใจ → PPV\" (สับสนกับเกณฑ์ CPR — เกณฑ์ PPV คือ HR &lt;100) · เริ่ม PPV ด้วย 21% O2 (term) แล้วปรับตาม SpO2 เป้า",
  wrong:["100% O2 แบบ free-flow ไม่ช่วยเมื่อ HR &lt;100 และทารกไม่หายใจดี — ต้อง <b>ventilate</b> · free-flow O2 ใช้กับทารกหายใจเองได้แต่ cyanosis · และ PPV ใน term เริ่มที่ 21% ไม่ใช่ 100% (ใช้ 100% เมื่อเริ่ม chest compression)","Intubation + meconium aspirator เป็นแนวทางเก่า (ก่อน NRP 2015) ที่ดูด meconium ใต้ vocal cords ในทารก non-vigorous ทุกราย — ปัจจุบันไม่แนะนำเป็น routine (ไม่ลด MAS และทำให้ PPV ช้า) · ทำเมื่อ PPV แล้วอกไม่ยกจากขี้เทาอุดตัน","Warm + dry + tactile stimulation เป็น initial steps ที่ต้องทำก่อนในนาทีแรก — แต่เมื่อประเมินแล้ว HR 80 + poor tone ต้องไปต่อที่ PPV ไม่ใช่กระตุ้นต่อ · ถ้าโจทย์ถาม \"สิ่งแรกที่ทำหลังเกิดทันที\" ก่อนประเมิน HR จะตอบช้อยนี้","Chest compression เริ่มเมื่อ <b>HR &lt;60</b> หลัง PPV ที่ได้ผล (อกยก) 30 วินาที — HR 80 และยังไม่ได้ PPV เลย"],
  trap:"MSAF ล่อให้ตอบดูดขี้เทาผ่านท่อ — <b>เปลี่ยนแนวทางแล้ว</b> · ผู้จดเขียนเกณฑ์ PPV เป็น HR &lt;60 (ผิด — HR &lt;60 คือเกณฑ์ CPR, PPV คือ HR &lt;100) · central cyanosis ล่อให้ให้ O2",
  summary:["MSAF + vigorous (ร้องดี tone ดี) → routine care/initial steps อยู่กับแม่ได้ · MSAF + non-vigorous → initial steps ที่ radiant warmer (warm, dry, position, clear airway ด้วย bulb ถ้าจำเป็น) → ถ้า apnea หรือ HR &lt;100 → PPV","<b>HR &lt;100 → PPV · HR &lt;60 → chest compression</b> (+ intubate + O2 100%)","Intubation + tracheal suction ทำเมื่อ airway อุดตันจาก meconium จน PPV ไม่ได้ผล","MAS: เกิดใน term/post-term ที่มี fetal distress (ขี้เทาออกก่อนคลอด) · ขี้เทา irritative (chemical pneumonitis, surfactant inactivation) + obstructive (ball-valve → air trapping) → หอบทันทีหลังคลอด · ภาวะแทรกซ้อน air leak (pneumothorax, pneumomediastinum), <b>PPHN</b> · CXR: patchy opacities + hyperinflation","SGA และ post-term เสี่ยง meconium aspiration (สไลด์ SGA complications: fetal distress มาก ถ่ายขี้เทา → MAS)"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"term newborn\", \"fetal distress with meconium-stained amniotic fluid\", \"cyanosis\", \"poor tone\" · วง <b>HR 80/min</b> · ท้ายคำถามเขียน <b>HR &lt;60 or ไม่หายใจ → PPV</b> · วงช้อย B<br>สไลด์หน้า 13 (NCPR – Essential): Breathing \"Apnea or gasping or HR &lt;100/min\" → เขียน <b>HR &lt;100 or ไม่หายใจ or หายใจเฮือก</b> → PPV → ET tube (กรอบแดง) · วง HR &lt;60 → chest compression · กล่องสรุป <b>HR &lt;100 PPV · HR &lt;60 CPR</b> · Initial steps resuscitation: warm, dry, stimulation, position airway, suction if needed → <b>วางบนที่เตรียมไว้ ห่อผ้า เช็ดตัว</b><br>สไลด์หน้า 14 (SGA complications): meconium aspiration → <b>fetal distress มาก ถ่ายขี้เทา MAS</b>",
  kimg:KI("14b","13d"), guide:NRP+" (MSAF: no routine intubation for tracheal suction)",
  mnemonic:"\"<b>ขี้เทาไม่ต้องดูด — ดู HR</b>\": &lt;100 ให้ลม (PPV) · &lt;60 ให้กด (CPR)",
  opinion:"⚠ เห็นด้วยกับผู้จด (B) มั่นใจสูง — ตาม NRP ปัจจุบันไม่ดูด meconium ผ่านท่อเป็น routine และ HR 80 เข้าเกณฑ์ PPV · ต้นฉบับมี 4 ช้อย เติม E (chest compression) เป็นตัวลวง · หมายเหตุ ลายมือผู้จดเขียนเกณฑ์ PPV เป็น \"HR &lt;60\" ซึ่งไม่ถูก (เกณฑ์ PPV คือ HR &lt;100) แต่คำตอบไม่เปลี่ยน",
  variants:["MSAF แต่ร้องดี tone ดี HR 150 → routine care/initial steps กับแม่ ไม่ต้องดูด","PPV 30 วินาทีอกไม่ยก แม้ปรับ mask/position แล้ว เห็นขี้เทาอุด → intubate + tracheal suction","PPV ได้ผล 30 วินาทีแล้ว HR 50 → chest compression + intubate + O2 100%"]}),
A({page:15, orig:"ไม่มีเลข (หน้า 15 สไลด์ 1)",
  stem:"A 42-week newborn is delivered by a 40-year-old mother without antenatal care. Apgar scores are 6 and 9. Physical examination shows low birth weight (<P10), a unilateral cleft lip, and a meconium-stained cord. What is the most useful investigation?",
  gray:"A 42-week newborn is delivered by a 40-year-old mother without antenatal care. Their Apgar score is 6, 9. Physical examination shows low birth weight (<P10), unilateral cleft lip, and meconium-stained cord. What is the most useful investigation? — A. Serial hematocrit B. Chest film C. Chromosome study D. Xx (recall ไม่มีช้อย D, E)",
  opts:["Serial hematocrit","Chest radiograph","Chromosome study","TORCH IgM","Blood culture"],
  ans:2, key:"C Chromosome study"+KS,
  flag:"⚠ recall ไม่ครบ: ช้อย D ต้นฉบับเขียนแค่ \"Xx\" และไม่มีช้อย E — แต่ง D, E เป็นตัวลวงที่เข้ากับเรื่อง (TORCH, sepsis)",
  interp:"แม่อายุมาก (40 ปี) ไม่ฝากครรภ์ + ทารก SGA (&lt;P10) + <b>congenital anomaly (cleft lip)</b> → คิดถึง chromosomal abnormality · โจทย์ไม่ระบุ HC → ผู้จดตีเป็น symmetrical SGA (สาเหตุจากตัวทารก)",
  why:"SGA ที่มี <b>malformation</b> ร่วมกับ <b>advanced maternal age</b> (≥35 ปี เสี่ยง aneuploidy จาก nondisjunction) → สาเหตุ intrinsic ของทารก (chromosome/genetic) → <b>chromosome study (karyotype)</b> มีประโยชน์ที่สุดในการหาสาเหตุ · cleft lip/palate พบร่วมใน <b>trisomy 13</b> (Patau: cleft lip/palate, holoprosencephaly, polydactyly, microphthalmia, cutis aplasia) และ trisomy 18 (Edwards: IUGR, clenched hand, rocker-bottom feet) · symmetrical SGA เกิดตั้งแต่ไตรมาสแรก จึงกระทบทั้งตัวและสมอง · TORCH เป็นสาเหตุ symmetrical SGA ได้เหมือนกัน แต่ต้องมีอาการ/อาการแสดงอื่น (ตา ตับม้ามโต ผื่น ICC) ซึ่งโจทย์ไม่มี — ผู้จดเขียน \"TORCH → ต้องมีอาการ, ตา\" · ไม่ฝากครรภ์ทำให้ไม่ได้คัดกรองก่อนคลอด",
  wrong:["Serial Hct ใช้ติดตามเลือดออก (เช่น subgaleal) หรือ polycythemia (SGA เสี่ยง polycythemia) — ไม่ตอบสาเหตุของ SGA + anomaly · ถ้าโจทย์ให้ทารก plethora/ซึม จะคิดถึงการเจาะ Hct","Chest film ใช้เมื่อมีอาการทางหายใจ (เช่น MAS ที่เข้ากับ 42 wk + meconium-stained cord) — ทารกนี้ Apgar 9 ไม่มีอาการ · ถ้าโจทย์ให้ respiratory distress จะตอบ CXR","TORCH IgM คิดเมื่อมีอาการแสดงของ congenital infection: cataract/chorioretinitis, hepatosplenomegaly, jaundice, blueberry muffin rash, microcephaly + ICC, thrombocytopenia — โจทย์มีแค่ SGA + cleft lip ซึ่งเป็น malformation ไม่ใช่ลักษณะของการติดเชื้อ","Blood culture ใช้เมื่อสงสัย sepsis (temperature instability, respiratory distress, lethargy, maternal risk factor เช่น PROM, ไข้) — ทารกนี้ไม่มีอาการ"],
  trap:"meconium-stained cord + 42 wk ล่อไปทาง MAS/post-term (CXR) — แต่โจทย์ถาม \"most useful investigation\" ของภาพรวม <b>SGA + cleft lip + แม่อายุมาก</b> = chromosome · TORCH ก็ทำ symmetrical SGA ได้แต่ต้องมีอาการอื่น",
  summary:["<b>Symmetrical SGA</b> (สไลด์): usually intrinsic to infant — chromosome abnormalities, genetic disorders, congenital infection (TORCH) · body affected + <b>brain affected (ศีรษะเล็กด้วย)</b> · early in the first trimester","<b>Asymmetrical SGA</b>: placenta, maternal illness — chronic hypertension, pre-eclampsia, chronic fetal distress · body affected, <b>brain not affected (brain sparing)</b> · usually third trimester or late second trimester","ภาวะแทรกซ้อน SGA (สไลด์): perinatal asphyxia, meconium aspiration, hypoglycemia, polycythemia, hypothermia","SGA + malformation หรือ dysmorphic + แม่อายุมาก → chromosome study · SGA + อาการ congenital infection (ตา ตับม้ามโต ผื่น ICC) → TORCH work-up · SGA แบบ asymmetrical จากแม่ (PIH) ไม่ต้องตรวจ chromosome","Trisomy 13: cleft lip/palate, holoprosencephaly, microphthalmia, polydactyly, cutis aplasia, CHD · Trisomy 18: IUGR, clenched fist overlapping fingers, rocker-bottom feet, CHD · Trisomy 21: hypotonia, upslanting palpebral fissures, single palmar crease, AVSD, duodenal atresia","Post-term (≥42 wk): dysmaturity, MAS, oligohydramnios, macrosomia/SGA"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"42-week newborn\" และ \"40-year-old mother\" → <b>แม่อายุมาก</b> · ไฮไลต์ \"Apgar score is 6, 9\" · ไฮไลต์ฟ้า \"low birth weight (&lt;P10)\", \"cleft lip\", \"meconium-stained cord\" · เส้นจาก low birth weight → <b>ไม่ระบุ HC</b> → <b>= symmetrical SGA</b> → วงเล็บ <b>chromosome</b> / <b>TORCH → ต้องมีอาการ, ตา</b> · วงช้อย C<br>สไลด์หน้า 14 (SGA ตาราง): Symmetrical → <b>เกิดจากตัวเด็กเอง</b> · Asymmetrical → <b>เกิดจากแม่</b> · ไฮไลต์ \"Chromosome abnormalities, genetic disorders, congenital infection (TORCH)\" · brain affected Yes/No !! · first trimester → <b>เร็ว ∴ หัวเล็กด้วย</b> · third trimester or late second trimester → <b>2–3 trimester</b> · SGA complications: meconium aspiration → <b>fetal distress มาก ถ่ายขี้เทา MAS</b>",
  kimg:KI("15a","14c","14d"), guide:NEL+" (SGA/IUGR; Cytogenetics – trisomy 13, 18) · ACOG Practice Bulletin No. 227: Fetal Growth Restriction (2021)",
  mnemonic:"\"<b>Symmetrical = Self</b> (ตัวเด็ก: chromosome/TORCH, ไตรมาสแรก, หัวเล็ก) · <b>Asymmetrical = mAternal</b> (รก/แม่, ไตรมาส 3, หัวรอด)\"",
  opinion:"⚠ เห็นด้วยกับผู้จด (C) มั่นใจปานกลาง–สูง — recall ไม่ครบ (ช้อย D เขียนแค่ \"Xx\" ไม่มี E) จึงแต่งเพิ่ม 2 ช้อย · ถ้าช้อยจริงมี TORCH IgM ก็ยังเลือก chromosome เพราะโจทย์มี malformation + แม่อายุมาก และไม่มีอาการของ congenital infection · ถ้าโจทย์ให้ cataract/ตับม้ามโต/ผื่น จะตอบ TORCH แทน",
  variants:["SGA + cataract + PDA murmur + hepatosplenomegaly + blueberry muffin → congenital rubella (TORCH work-up)","HC ปกติ น้ำหนักน้อย แม่ preeclampsia → asymmetrical SGA (ไม่ต้องตรวจ chromosome) · ติดตาม hypoglycemia/polycythemia","ทารก 42 wk ขี้เทาเคลือบตัว หอบหลังคลอด CXR patchy + hyperinflation → meconium aspiration syndrome"]}),
A({page:15, orig:"ไม่มีเลข (หน้า 15 สไลด์ 2)",
  stem:"A 40-year-old woman without antenatal care delivers an infant at 40 weeks of gestation. The birth weight is below the 10th percentile, and the head circumference is at the 50th percentile. Physical examination shows an isolated unilateral cleft lip. What is the most proper investigation?",
  gray:"A 40-year-old woman delivers an infant of 40 weeks gestation without antenatal care. Her child birthweight is below P10, head circumference at P50. Physical examination shows isolated unilateral cleft lip. What is the most proper investigation? — A. LFT B. Chest x-ray C. TORCH IgM D. Chromosome studies E. Hemoculture",
  opts:["Liver function test","Chest radiograph","TORCH IgM","Chromosome studies","Hemoculture"],
  ans:3, key:"D Chromosome studies"+KS,
  flag:"⚠ ผู้จดเขียนว่า BW &lt;P10 + HC P50 = asymmetrical (ปกติไม่ใช่สาเหตุโครโมโซม) แต่น่าจะพิมพ์ผิด ควรเป็น symmetrical — คำตอบยังเป็น chromosome studies เพราะ congenital anomaly (cleft lip) + แม่อายุ 40",
  interp:"แม่อายุ 40 ปี ไม่ฝากครรภ์ + ทารก SGA + <b>cleft lip</b> (congenital malformation) → ตรวจหา chromosomal abnormality · ตัวเลข HC P50 ทำให้ดูเป็น asymmetrical ซึ่งไม่เข้ากับสาเหตุโครโมโซม (ผู้จดคิดว่าพิมพ์ผิด)",
  why:"ทารกที่มี <b>congenital malformation</b> และแม่อายุมาก (≥35 ปี — nondisjunction ใน meiosis เพิ่มตามอายุ) → ความเสี่ยง aneuploidy สูง → <b>chromosome studies (karyotype / chromosomal microarray)</b> เป็นการตรวจที่เหมาะที่สุด · แม้ตัวเลขในโจทย์ (BW &lt;P10, HC P50) จะเข้ากับ asymmetrical SGA ซึ่งมักเกิดจากรก/แม่ แต่ <b>cleft lip ชี้ไปที่สาเหตุจากตัวทารก</b> และโจทย์ตั้งใจให้ตอบโครโมโซม (ผู้จดวง \"cleft\" ลากลูกศรไปช้อย D) · TORCH IgM ไม่ช่วยเพราะไม่มีอาการ congenital infection และ TORCH ทำให้ศีรษะเล็กด้วย (symmetrical) · ข้อนี้เป็นคู่กับข้อก่อนหน้า (หน้า 15 สไลด์ 1) คำตอบสอดคล้องกัน",
  wrong:["LFT ไม่ช่วยหาสาเหตุ SGA + cleft lip — ใช้เมื่อมี conjugated hyperbilirubinemia/ตับโต (เช่น TORCH, biliary atresia) · ผู้จดใส่ \"?\" ที่ช้อยนี้","CXR ใช้เมื่อมีอาการทางหายใจ (MAS, pneumonia, CDH) หรือหา anomaly ของกระดูก/หัวใจบางอย่าง — ทารกนี้ไม่มีอาการ ไม่ใช่การตรวจหาสาเหตุ · ผู้จดใส่ \"?\"","TORCH IgM คิดเมื่อมีอาการของ congenital infection (cataract, chorioretinitis, ตับม้ามโต, ICC, ผื่น blueberry muffin, thrombocytopenia) และมักทำให้ศีรษะเล็กด้วย — ไม่มีในโจทย์ · ผู้จดเขียน <b>if น่าจะมีอาการอื่น</b>","Hemoculture ใช้เมื่อสงสัย sepsis (temperature instability, respiratory distress, lethargy, maternal risk) — ทารกไม่มีอาการ และการติดเชื้อหลังคลอดไม่ทำให้เกิด SGA หรือ cleft lip"],
  trap:"HC P50 ทำให้คิดว่า asymmetrical → ไม่ต้องตรวจ chromosome — แต่ <b>malformation + แม่อายุมาก</b> สำคัญกว่าในการเลือกตรวจ · \"isolated\" cleft lip ส่วนใหญ่เป็น multifactorial แต่ในบริบท SGA + แม่ 40 ปี ต้องหา aneuploidy",
  summary:["Cleft lip/palate: isolated พบบ่อย (multifactorial; 1 ใน 700) แต่ถ้ามี SGA, anomaly อื่น, dysmorphism หรือแม่อายุมาก → karyotype/chromosomal microarray (trisomy 13 เด่นเรื่อง cleft lip/palate, holoprosencephaly, polydactyly; 22q11 deletion กับ cleft palate)","Symmetrical vs asymmetrical SGA: ศีรษะเล็กด้วย (symmetrical, intrinsic — chromosome/genetic/TORCH, ไตรมาสแรก) vs ศีรษะไม่เล็ก (asymmetrical, placental/maternal — chronic HT, preeclampsia, chronic fetal distress, ไตรมาส 3 / ปลายไตรมาส 2)","Advanced maternal age (≥35 ปี): เพิ่ม aneuploidy (trisomy 21, 18, 13) → คัดกรองก่อนคลอด (NIPT, quadruple test, ultrasound) — ทารกนี้ไม่ได้ฝากครรภ์จึงไม่ได้คัดกรอง","SGA work-up: ดูว่า symmetrical/asymmetrical, หา malformation/dysmorphism (→ chromosome), อาการ congenital infection (→ TORCH), ประวัติแม่ (PIH, สูบบุหรี่, ยา) · ติดตาม hypoglycemia, polycythemia, hypothermia","TORCH ทั่วไป (สไลด์): IUGR, microcephaly, ventriculomegaly, intracranial calcification, optic nerve hypoplasia, chorioretinal atrophy"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ \"40 weeks gestation\", ขีดเส้นใต้ \"birthweight is below P10\", ไฮไลต์ \"head circumference at P50\" · ลากเส้นจากตัวเลขขึ้นไปเขียน <b>อย่างนี้ = asym แต่น่าจะพิมพ์ผิด น่าจะต้องเป็น sym</b> · ไฮไลต์เขียว \"isolated unilateral cleft lip\" + วง \"cleft\" ลากลูกศรยาวไปช้อย D · A LFT <b>?</b> · B Chest x-ray <b>?</b> · C TORCH IgM → <b>if น่าจะมีอาการอื่น</b> · วงช้อย D<br>สไลด์หน้า 14 (SGA ตาราง): Symmetrical <b>เกิดจากตัวเด็กเอง</b> (chromosome abnormalities, genetic disorders, congenital infection) · Asymmetrical <b>เกิดจากแม่</b> · brain affected Yes / No !! · first trimester → <b>เร็ว ∴ หัวเล็กด้วย</b>",
  kimg:KI("15b","14c"), guide:NEL+" (SGA; Cleft lip and palate; Cytogenetics) · ACOG Practice Bulletin No. 226: Screening for Fetal Chromosomal Abnormalities (2020)",
  mnemonic:"\"<b>ปากแหว่ง + แม่แก่ = ส่งโครโมโซม</b>\" (trisomy 13: cleft, polydactyly, holoprosencephaly)",
  opinion:"⚠ เห็นด้วยกับผู้จด (D) มั่นใจปานกลาง–สูง — ตัวเลขในโจทย์ (BW &lt;P10 แต่ HC P50) เป็น asymmetrical SGA ซึ่งปกติเกิดจากรก/แม่ ผู้จดเห็นว่าน่าจะพิมพ์ผิด · แต่ไม่ว่า HC จะเป็นเท่าไร cleft lip + แม่อายุ 40 ปี + ไม่ได้คัดกรองก่อนคลอด ก็ยังทำให้ chromosome studies เป็นการตรวจที่ได้ประโยชน์ที่สุดในช้อยที่มี · ถ้าโจทย์ไม่มี cleft lip และ HC ปกติ จะไม่ต้องตรวจโครโมโซม",
  variants:["BW &lt;P10 HC &lt;P10 + cataract + PDA + hepatosplenomegaly → congenital rubella (TORCH IgM)","Asymmetrical SGA ไม่มี anomaly แม่ preeclampsia → ไม่ต้อง karyotype ติดตาม hypoglycemia/polycythemia/hypothermia","ทารก cleft lip/palate + polydactyly + microphthalmia + holoprosencephaly → trisomy 13 (karyotype)"]}),
A({page:16, orig:"18",
  stem:"A 2,100-g male infant was delivered. His mother had no antenatal care. Physical examination: head circumference 27 cm, chest circumference 27 cm, length 40 cm, clouded lens, no pallor, no jaundice, a grade III systolic ejection murmur at the left upper parasternal border, clear lungs, liver 4 cm below the right costal margin, and spleen 1 cm below the left costal margin. What is the most likely diagnosis?",
  gray:"18. A 2,100 g male infant was delivered. His mother has no ANC. Physical examination: HC 27 cm, CC 27 cm, Length 40 cm, clouded lens, no pallor, no jaundice, SEM grade III at left upper parasternal border, lungs clear, liver 4 cm. BRCM, spleen 1 cm BLCM. What is the most likely diagnosis? — A. Congenital CMV B. Congenital rubella C. Congenital syphilis D. Congenital toxoplasmosis E. Congenital retinoblastoma",
  opts:["Congenital CMV","Congenital rubella","Congenital syphilis","Congenital toxoplasmosis","Congenital retinoblastoma"],
  ans:1, key:"B Congenital rubella"+KS,
  interp:"ไม่ฝากครรภ์ + symmetrical SGA (BW 2,100 g, length 40 cm, <b>HC 27 cm</b> — microcephaly, term ควร ≈ 33–35 cm) + <b>clouded lens (cataract)</b> + <b>SEM ที่ LUPSB (PDA/pulmonary artery stenosis)</b> + hepatosplenomegaly = <b>congenital rubella syndrome</b>",
  why:"Congenital rubella syndrome เกิดจากแม่ติด rubella ช่วง <b>ไตรมาสแรก</b> (โดยเฉพาะ &lt;12 wk — ความเสี่ยงความพิการสูงสุด) → virus ยับยั้ง cell division และทำลาย vascular endothelium → <b>symmetrical IUGR</b> + microcephaly · triad คลาสสิก (Gregg): <b>ตา – cataract</b> (\"clouded lens\" = keyword), congenital glaucoma, salt-and-pepper (pigmentary) retinopathy · <b>หัวใจ – PDA</b> (พบบ่อยสุด) และ <b>peripheral pulmonary artery stenosis</b> (murmur ที่ left upper parasternal border) · <b>หู – sensorineural hearing loss</b> (พบบ่อยที่สุดโดยรวม) · ร่วมกับ hepatosplenomegaly, blueberry muffin rash (dermal erythropoiesis), thrombocytopenia, radiolucent bone lesions · Dx: rubella IgM ในทารก หรือ RT-PCR จากคอ/ปัสสาวะ (ทารกขับเชื้อได้นานถึง 1 ปี — แยกห้องจากหญิงตั้งครรภ์) · ป้องกันด้วย MMR วัคซีนก่อนตั้งครรภ์",
  wrong:["Congenital CMV (พบบ่อยที่สุดของ congenital infection): <b>periventricular calcification</b>, microcephaly, SNHL (progressive), chorioretinitis, petechiae/blueberry muffin, hepatosplenomegaly, jaundice — <b>ไม่เด่นเรื่อง cataract และ CHD</b> · ถ้าโจทย์ให้ periventricular calcification + SNHL จะตอบ CMV","Congenital syphilis: early — <b>snuffles</b> (rhinitis), maculopapular rash ที่ <b>ฝ่ามือฝ่าเท้า</b> (desquamation), bone change (osteochondritis, periostitis → pseudoparalysis of Parrot), hepatosplenomegaly, jaundice, anemia · late — Hutchinson teeth, saddle nose, saber shin · ไม่ทำ cataract/PDA","Congenital toxoplasmosis: classic triad <b>chorioretinitis + hydrocephalus + diffuse intracranial calcification</b> (กระจายทั่วเนื้อสมอง) · ส่วนใหญ่ไม่มีอาการตอนเกิด · ไม่ทำ cataract หรือ CHD","Retinoblastoma ให้ <b>leukocoria</b> (white pupillary reflex จากก้อนที่ retina) — ไม่ใช่ lens ขุ่น และไม่อธิบาย SGA, microcephaly, murmur และตับม้ามโต · ไม่ใช่ congenital infection"],
  trap:"\"clouded lens\" = <b>cataract → rubella</b> · อย่าสับสนกับ leukocoria ของ retinoblastoma (เงาขาวที่ retina) · chorioretinitis → toxo · periventricular calcification → CMV · \"no jaundice\" ไม่ได้ตัด TORCH",
  summary:["TORCH ทั่วไป (สไลด์): <b>IUGR</b> (intrauterine growth restriction — ตัวเล็กกว่าอายุครรภ์), microcephaly, ventriculomegaly, intracranial calcification, optic nerve hypoplasia, chorioretinal atrophy","<b>Toxoplasmosis</b>: intracranial calcification (diffuse), hydrocephalus, chorioretinitis","<b>Syphilis</b>: snuffles, maculopapular rash (on palms and soles), bone change (osteochondritis and periostitis)","<b>Rubella ★</b>: blueberry muffin, eye defects (cataracts, congenital glaucoma, pigmentary retinopathy), congenital heart disease (most commonly PDA, pulmonary artery stenosis) + SNHL","<b>CMV ★</b>: periventricular intracranial calcifications, microcephaly (+ SNHL, petechiae)","<b>HSV</b>: mucocutaneous vesicles or scarring, conjunctivitis, keratoconjunctivitis, elevated liver enzymes · <b>Zika</b>: microcephaly, ventriculomegaly, intracranial calcifications, optic nerve hypoplasia","Normal term newborn: BW 2,500–4,000 g, length ≈ 50 cm, HC ≈ 33–35 cm (HC ≈ chest circumference; HC &gt; CC เล็กน้อยในทารกแรกเกิด)"],
  notes:"ลายมือบนโจทย์: \"2,100 g male infant\" ลากเส้นไปเขียน <b>หัวและตัวเล็ก ⇒ sym SGA</b> → <b>TORCH / Genetic</b> · ใต้ HC 27 cm เขียน <b>ควร ≈ 30 cm</b> · ไฮไลต์ \"HC 27 cm, CC 27 cm, Length 40 cm\" · ไฮไลต์ชมพู \"clouded lens\", \"liver 4 cm. BRCM, spleen 1 cm BLCM\" · ใต้บรรทัดเขียน <b>ต้อกระจก = KW → TORCH</b> (วงฟ้า KW) · ไฮไลต์ช้อย B<br>สไลด์หน้า 15 (TORCH): O – Others (syphilis, Zika) + <b>VZV</b> · IUGR → <b>intrauterine growth restriction ตัวเล็กกว่าอายุครรภ์</b> · ตาราง signs: <b>★ Rubella → heart ✓</b> (ไฮไลต์ blueberry muffin, congenital glaucoma, congenital heart disease) · <b>★ Cytomegalovirus</b> (ไฮไลต์ periventricular intracranial calcifications) · ไฮไลต์ syphilis maculopapular rash, bone change · HSV mucocutaneous vesicles · Zika microcephaly",
  kimg:KI("16a","15d"), guide:"AAP Red Book 2024–2027 (Rubella) · "+NEL+" (Rubella; TORCH infections)",
  mnemonic:"\"<b>Rubella = ตา-หู-หัวใจ</b>\" (cataract · deafness · PDA) + blueberry muffin · CMV = Calcification รอบ ventricle · Toxo = Calcification กระจาย + Chorioretinitis",
  opinion:"เห็นด้วยกับผู้จด (B) มั่นใจสูง — cataract + murmur (PDA/pulmonary artery stenosis) + symmetrical SGA + hepatosplenomegaly ในแม่ไม่ฝากครรภ์ เป็นภาพ congenital rubella syndrome ชัดเจน และเป็น TORCH ตัวเดียวในช้อยที่เด่นทั้งเรื่องตาและหัวใจ",
  variants:["periventricular calcification + microcephaly + SNHL + petechiae → congenital CMV (ganciclovir/valganciclovir ถ้ามีอาการ)","snuffles + rash ฝ่ามือฝ่าเท้าลอก + periostitis + hepatosplenomegaly → congenital syphilis (penicillin G 10 วัน)","hydrocephalus + chorioretinitis + diffuse intracranial calcification → congenital toxoplasmosis (pyrimethamine + sulfadiazine + folinic acid)"]}),
A({page:16, orig:"6",
  stem:"A 7-day-old term female newborn is brought to the clinic with bilateral eye discharge for 4 days. She received silver nitrate eye ointment at birth. Gram stain of the discharge shows few PMNs and no organisms. What is the most likely diagnosis?",
  gray:"6. A 7-day-old term female newborn is brought to the clinic with bilateral eye discharge for 4 days. She received silver nitrate eye ointment at birth. Gram stain of the discharge: few PMN, no organisms. What is the most likely diagnosis? — A. Chlamydial conjunctivitis B. Gonococcal conjunctivitis C. Viral conjunctivitis D. Chemical conjunctivitis E. Atopic conjunctivitis",
  opts:["Chlamydial conjunctivitis","Gonococcal conjunctivitis","Viral conjunctivitis","Chemical conjunctivitis","Atopic conjunctivitis"],
  ans:3, key:"D Chemical conjunctivitis"+KS,
  flag:"⚠ ไม่แน่ใจ: ตามตาราง Nelson chemical conjunctivitis เริ่มใน <b>24 ชม.</b> และหายเองใน &lt;48 ชม. — โจทย์เริ่มวันที่ 3 และเป็นมา 4 วัน ไม่เข้ากับ chemical นัก · Gram stain ไม่เห็นเชื้อ + PMN เกิดได้ใน <b>Chlamydia</b> ด้วย (intracellular ไม่ติด Gram; onset 5–14 วัน) — คงคีย์ D ตามผู้จดเพราะโจทย์ชี้ silver nitrate + PMN น้อย + ไม่มีเชื้อ แต่ถ้าโจทย์ให้ onset 5–14 วัน หรือมี pseudomembrane/Giemsa พบ inclusion → ตอบ Chlamydia",
  interp:"ได้ <b>silver nitrate</b> ป้ายตาตอนเกิด + discharge ทั้งสองข้าง + Gram stain <b>PMN น้อย ไม่พบเชื้อ</b> → ไม่ใช่ bacterial ที่เห็นใน Gram (gonococcus ต้องเห็น GN intracellular diplococci) → noninfectious = chemical (ตามคีย์)",
  why:"Silver nitrate 1% (ยาป้องกัน gonococcal ophthalmia neonatorum แบบเก่า — Credé prophylaxis) ระคายเคือง conjunctiva → <b>chemical conjunctivitis</b>: noninfectious, lid edema, watery/serous discharge, Gram stain มี PMN น้อยและ <b>ไม่พบเชื้อ</b>, ประวัติสัมผัสยา, หายเอง (self-limited) ไม่ต้องรักษา · ตาราง Nelson (สไลด์กรอบแดง) ให้ onset 24 ชม. หายใน &lt;48 ชม. · ปัจจุบันจึงเปลี่ยนไปใช้ <b>erythromycin 0.5% หรือ tetracycline ointment</b> ป้องกันแทน (ระคายเคืองน้อยกว่า — ผู้จดเขียน \"ป้ายยาให้เลย tetracycline = OK\") · ข้อสังเกต: onset ในโจทย์ (วันที่ 3 เป็นมา 4 วัน) ช้ากว่า chemical ทั่วไป — ดูความเห็นด้านล่าง",
  wrong:["Chlamydia trachomatis (สาเหตุติดเชื้อที่พบบ่อยที่สุด): onset <b>5–14 วัน</b>, mild mucopurulent nonfollicular conjunctivitis, lid edema, <b>pseudomembrane</b>, pneumonitis ตามมาที่ 3–12 wk (staccato cough) · เป็น obligate intracellular จึง <b>ไม่เห็นใน Gram stain</b> → Dx Giemsa (basophilic intracytoplasmic inclusion), DFA, NAAT/PCR · Rx <b>oral</b> erythromycin 12.5 mg/kg q6h 14 วัน หรือ azithromycin 20 mg/kg/day 3 วัน (topical อย่างเดียวไม่พอ) — เป็นตัวลวงที่ใกล้เคียงที่สุดของข้อนี้","Neisseria gonorrhoeae: onset 2–5 (3–4) วัน, bilateral <b>hyperacute purulent</b> conjunctivitis, marked lid edema, copious discharge, corneal ulcer/perforation ได้ · Gram stain พบ <b>gram-negative intracellular diplococci</b> · Rx ceftriaxone 25–50 mg/kg IV/IM ครั้งเดียว + saline irrigation — ข้อนี้ไม่พบเชื้อและ PMN น้อย","Viral (HSV): onset 6–14 วัน, unilateral หรือ bilateral nonfollicular conjunctivitis, serous discharge, vesicles ที่ผิว, dendritic keratitis (fluorescein) · Dx PCR/viral culture, multinucleated giant cells · Rx acyclovir IV 60 mg/kg/day 14–21 วัน + topical — ต้องคิดเมื่อมี vesicle หรือแม่มี genital herpes","Atopic/allergic conjunctivitis เป็น IgE-mediated ต้องมี sensitization ก่อน ไม่เกิดในทารกแรกเกิดอายุ 7 วัน (เด่นคันตา chemosis eosinophil ในเด็กโต)"],
  trap:"ช้อยสุดท้ายที่ไม่เกี่ยว (atopic) และ \"no organisms\" ล่อว่าไม่ติดเชื้อ — แต่ <b>Chlamydia ก็ไม่เห็นใน Gram stain</b> · ต้องดู onset + ลักษณะ discharge + ประวัติยาหยอดตา ร่วมกัน · keyword ที่โจทย์ใส่คือ silver nitrate",
  summary:["Neonatal conjunctivitis ตาม onset (Nelson Table): <b>chemical 24 ชม.</b> · gonococcal 2–5 (3–4) วัน · chlamydia 5–14 (5–7) วัน · staph/strep/other bacteria 5–14 วัน · HSV 6–14 วัน","Chemical: noninfectious, lid edema, watery discharge, หายเองใน &lt;48 ชม. ไม่ต้องรักษา (ประวัติสัมผัส silver nitrate)","Gonococcal: hyperacute purulent bilateral, marked lid edema, corneal perforation ได้ · Gram stain GN intracellular diplococci + culture · <b>ceftriaxone 25–50 mg/kg IV/IM ครั้งเดียว</b> + irrigation (topical ใช้เฉพาะเมื่อมี corneal ulcer ร่วม)","Chlamydia: พบบ่อยสุด, mucopurulent, pseudomembrane, pneumonitis 3–12 wk · Giemsa inclusion/DFA/PCR · <b>oral</b> erythromycin 14 วัน หรือ azithromycin 3 วัน (เสี่ยง infantile hypertrophic pyloric stenosis กับ macrolide &lt;6 wk)","Staph/strep: nosocomial, mucoid discharge, hyperemia, chemosis · Gram stain/culture · broad-spectrum topical antibiotic · HSV: vesicles, dendritic keratitis · IV acyclovir + topical","Prophylaxis ปัจจุบัน: erythromycin 0.5% (หรือ tetracycline 1%) ointment หลังคลอดทันที — ป้องกัน gonococcal ได้ดี แต่ไม่ป้องกัน chlamydia ได้ดี"],
  notes:"ลายมือบนโจทย์: ไฮไลต์ชมพู \"eye discharge for 4 days\", \"silver nitrate eye ointment at birth\" (เหนือคำว่า silver nitrate เขียน <b>ยาป้ายตา</b>), \"few PMN, no organisms\" · วงช้อย D<br>สไลด์หน้า 16 (Neonatal conjunctivitis — Nelson Table 96.1): กรอบแดงแถว Chemical + Gonococcal · Chemical ไฮไลต์ \"Noninfectious, lid edema, watery discharge\", onset 24 h, Dx \"history of exposure, self-limited in &lt;48 h\", treatment None · ลายมือซ้ายตาราง: <b>ป้ายยาให้เลย tetracycline = OK</b> · ใต้ Chemical เขียน <b>หยอดตาตอนคลอด</b> · Gonococcal 3–4 days ไฮไลต์ \"hyperacute purulent conjunctivitis\", \"Gram-negative intracellular diplococci\", Ceftriaxone 25–50 mg/kg + เขียน <b>หนองไหล</b> ★ · แถว Chlamydia (most common) 5–7 days, Giemsa intracytoplasmic inclusions, oral erythromycin/azithromycin (ไม่ได้ไฮไลต์)",
  kimg:KI("16c","16b"), guide:NEL+" Table 96.1 (Neonatal conjunctivitis) · AAP Red Book 2024–2027 (Gonococcal, Chlamydial infections) · CDC STI Treatment Guidelines 2021",
  mnemonic:"\"<b>ยิ่งช้า ยิ่ง Chlamydia</b>\": Chemical วันแรก → Gono 2–5 วัน (หนองไหลพุ่ง) → Chlamydia 5–14 วัน (Gram ไม่เห็น)",
  opinion:"⚠ คงคีย์ D ตามผู้จด มั่นใจปานกลาง — โจทย์ใส่ silver nitrate + PMN น้อย + ไม่พบเชื้อ ซึ่งเป็นลักษณะ chemical ตามที่ข้อสอบตั้งใจ · แต่ onset (เริ่มวันที่ 3 เป็นมา 4 วัน ไม่หาย) ไม่เข้ากับ chemical ที่ควรเริ่มใน 24 ชม. และหายใน 48 ชม. และ Chlamydia ก็ไม่เห็นใน Gram stain (onset 5–14 วัน) — ถ้าโจทย์ให้ onset วันที่ 5–14, mucopurulent, pseudomembrane หรือ Giemsa พบ inclusion → ตอบ Chlamydia (A)",
  variants:["อายุ 3 วัน หนองไหลมาก หนังตาบวมตึง Gram stain GN intracellular diplococci → gonococcal → ceftriaxone 25–50 mg/kg IV/IM ครั้งเดียว + irrigation","อายุ 10 วัน ตาแดงมีหนองเล็กน้อย Gram ไม่พบเชื้อ ต่อมามีไอแบบ staccato อายุ 6 wk → chlamydia → oral erythromycin 14 วัน หรือ azithromycin 3 วัน","ได้ silver nitrate ตาแดง น้ำตาไหลภายใน 12 ชม. หายเองใน 2 วัน → chemical conjunctivitis ไม่ต้องรักษา"]}),
A({page:17, orig:"ไม่มีเลข (หน้า 17 ลายมือ)",
  stem:"A term newborn with a 1-minute Apgar score of 3 develops mild jaundice that requires phototherapy. The physician plans an auditory brainstem response (ABR) hearing screening in addition to routine screening. Which of the following is the reason for performing ABR in this infant?",
  gray:"โจทย์ (ลายมือ หน้าสุดท้าย): เหลืองเล็กน้อย ต้องฉายแสง low apgar score ต้องตรวจการได้ยินเพราะ?? — A. เหลือง B. ฉายแสง C. low apgar score",
  opts:["Neonatal jaundice","Phototherapy","Low Apgar score","Female sex","Cesarean delivery"],
  ans:2, key:"C Low Apgar score"+KS,
  flag:"⚠ recall จากลายมือ ไม่มีโจทย์ภาษาอังกฤษ/ช้อย D–E — แต่งโจทย์ให้ครบ (ช้อย A–C ตามต้นฉบับ)",
  interp:"ถามว่าข้อใดเป็น <b>ข้อบ่งชี้ของ ABR</b> (ทารกกลุ่มเสี่ยงต่อการได้ยินผิดปกติ) — เหลืองเล็กน้อยที่ฉายแสงอย่างเดียวไม่นับ ต้องเหลืองจนถึงเกณฑ์ exchange",
  why:"Newborn hearing screening: <b>OAE (otoacoustic emissions) ตรวจทุกคน</b> · ทารก<b>กลุ่มเสี่ยง</b>ต้องตรวจ <b>ABR (automated auditory brainstem response)</b> เพราะ OAE ประเมินแค่ cochlea (outer hair cells) จับ <b>auditory neuropathy / retrocochlear lesion</b> ไม่ได้ ซึ่งพบบ่อยในทารก NICU, hyperbilirubinemia รุนแรง และ hypoxia · กลุ่มเสี่ยงตามลายมือ: เหลืองจนถึงเกณฑ์ exchange transfusion, chromosome abnormality, craniofacial malformation, meningitis (อาจกด brainstem), ได้ ototoxic drugs (gentamicin/aminoglycoside, lasix), เจ็บป่วยหนักอยู่ รพ.นาน และ <b>low Apgar score → เลือดไปเลี้ยงสมองน้อย</b> (perinatal asphyxia/HIE ทำลาย cochlea และ auditory pathway) · ทารกนี้ Apgar 1 นาที = 3 จึงเป็นข้อบ่งชี้ ส่วนเหลืองเล็กน้อยที่ฉายแสงยังไม่ถึงเกณฑ์",
  wrong:["เหลืองเป็นข้อบ่งชี้ ABR เฉพาะเมื่อ <b>hyperbilirubinemia รุนแรงถึงเกณฑ์ exchange transfusion</b> (bilirubin ทำลาย brainstem auditory nuclei → auditory neuropathy) — เหลืองเล็กน้อยไม่ใช่ · ถ้าโจทย์ให้ TSB ถึงเกณฑ์ exchange จะตอบช้อยนี้","การฉายแสงเอง (phototherapy) ไม่ทำให้หูเสียและไม่ใช่ข้อบ่งชี้ ABR — ผลข้างเคียงของ phototherapy คือ insensible water loss, loose stool, rash, bronze baby syndrome (ถ้ามี conjugated hyperbilirubinemia), retinal damage ถ้าไม่ปิดตา","เพศหญิงไม่ใช่ปัจจัยเสี่ยงของ permanent childhood hearing loss","การผ่าคลอด (cesarean) ไม่ใช่ปัจจัยเสี่ยงของการได้ยินผิดปกติ (อาจทำให้ OAE fail ชั่วคราวจาก vernix/น้ำในช่องหู แต่ไม่ใช่ข้อบ่งชี้ ABR)"],
  trap:"ช้อยเหลือง/ฉายแสงล่อ เพราะ hyperbilirubinemia อยู่ในรายการเสี่ยงจริง — แต่ต้อง <b>รุนแรงถึงเกณฑ์ exchange</b> · และ OAE ปกติไม่ได้ตัด auditory neuropathy ในกลุ่มเสี่ยง",

/* ================= OSCE: Legendary round (= สอบจริง) + Quality round (จับเวลา) =================
   ผู้ใช้สั่ง 19 ต.ค. 2026 — ใช้ทุกวอร์ดที่มี OSCE ของทั้ง MDCU และ SI · สิ่งที่ต่างกันต่อวอร์ดมีแค่ หัวข้อ (config wards[].osceTopics) และจำนวนข้อ/เวลาต่อข้อ
   (config wards[].exam.OSCE = {n, min} · แก้ในหน้า Admit · ICU · Discharge → st.wcfg[ward].examOS) · แต่ละ round ล้อแบบ MCQ:
   - Legendary: จำนวนข้อและเวลาต่อข้อ = สอบจริงเสมอ · IRL (โชว์แค่โจทย์ ผู้คุมคนจริงใช้ checklist ใต้โจทย์) / SIM (พิมพ์ตอบ ข้อที่ต้องพูดก็พิมพ์สิ่งที่จะพูด) · เวลาข้อพัก (ค่าเริ่ม 30 วิ) · หัวข้อ · วิธีเรียง

     · ข้อพัก (block, random): หลังข้อมีอาจารย์ทุกข้อ ยกเว้นหัตถการ · และทุก 3–5 ข้อไม่มีอาจารย์ (สุ่ม) · 1 เลขข้อ · แก้ตำแหน่งเองได้ในหน้าเตรียมสอบ

   - Quality: เหมือน Quality MCQ — เลือกปี (เรียงตามไฟล์) หรือสุ่มจากทั้งคลัง · กำหนดเวลาต่อข้อเอง · พักระหว่างข้อได้ (0 = ไม่พัก) · หมดเวลาเปลี่ยนข้อเอง

var OST=null,OSAI={busy:0,err:"",msg:""};
